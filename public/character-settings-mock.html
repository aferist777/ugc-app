<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Character settings — popup mockup</title>
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/app-nav.css">
<style>
/* ════════════════════════════════════════════════════════════════════════════
   MOCKUP — the Character page's own settings popup, the one that replaces both
   column gears (#cv2-gear and #cv2-sheet-gear).

   Shape: a 1/3 section rail on the left, the section's canvas on the right.
   Inside API: the chain across the top starting at the button, and under it a
   row — where that button lives on the page (1/3) and its fallback ladder (2/3).

   A ladder step is AGGREGATOR then MODEL then TIER, in that order, because the
   aggregator decides which models the list may contain. That order is what the
   gears being replaced already taught, and two screens teaching opposite orders
   is how a wrong pairing gets picked.
   ════════════════════════════════════════════════════════════════════════════ */

.mock-stage{
  flex:1; min-height:0; position:relative;
  background:
    repeating-linear-gradient(135deg, transparent 0 22px, oklch(.23 .018 265) 22px 23px),
    var(--bg);
}
.mock-hint{
  position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
  text-align:center; color:var(--muted); font-size:12px; line-height:1.7; opacity:.5;
}

/* ── nav: the gear, and the chip that names the page ───────────────────────── */
.sv3-nav .nav-gear{
  flex:0 0 auto; width:26px; height:22px; padding:0; margin-right:2px;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid transparent; border-radius:var(--r-xs);
  background:none; color:var(--muted); cursor:pointer; transition:.12s var(--ease);
}
.sv3-nav .nav-gear:hover{ color:var(--ink); border-color:var(--border); background:var(--surface-2); }
.sv3-nav .nav-gear.is-on{ color:var(--primary); border-color:var(--primary); }
.sv3-nav .nav-gear svg{ width:14px; height:14px; display:block; }
.sv3-nav .tag .tag-page{ color:var(--muted); font-weight:600; }

/* ── popup shell ───────────────────────────────────────────────────────────── */
.pop-back{
  position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  background:oklch(.12 .01 265 / .62); backdrop-filter:blur(3px); padding:26px;
}
.pop{
  display:flex; flex-direction:column; width:min(1180px,100%); height:min(780px,100%);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  box-shadow:var(--shadow); overflow:hidden;
}
.pop-head{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:12px 16px; background:var(--surface-2); border-bottom:1px solid var(--border);
}
.pop-head h2{
  margin:0; font-size:12px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink);
}
.pop-head .sub{ font-size:11px; color:var(--muted); }
.pop-head .sp{ flex:1; }
.pop-head .saves{ font-size:10.5px; color:var(--muted); opacity:.8; white-space:nowrap; }
.pop-x{
  width:24px; height:24px; border:1px solid var(--border); border-radius:var(--r-xs);
  background:none; color:var(--muted); font:400 15px/1 var(--font); cursor:pointer;
}
.pop-x:hover{ color:var(--ink); border-color:var(--muted); }

.pop-body{ flex:1; min-height:0; display:flex; }

.pop-rail{
  flex:0 0 33%; max-width:290px; min-width:190px;
  display:flex; flex-direction:column; gap:2px; padding:12px 10px;
  background:var(--bg); border-right:1px solid var(--border); overflow:auto;
}
.rail-t{
  font:700 9.5px var(--font); letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); opacity:.75; padding:9px 8px 5px;
}
.rail-i{
  display:flex; align-items:flex-start; gap:9px; width:100%; text-align:left;
  padding:9px 10px; border:1px solid transparent; border-radius:var(--r-sm);
  background:none; color:var(--muted); cursor:pointer; transition:.12s var(--ease);
}
.rail-i:hover{ background:var(--surface); color:var(--ink); }
.rail-i.cur{ background:var(--surface-2); border-color:var(--border); color:var(--ink); }
.rail-i .ic{ flex:0 0 auto; width:14px; height:14px; margin-top:1px; opacity:.85; }
.rail-i .ic svg{ width:14px; height:14px; display:block; }
.rail-i .tx{ min-width:0; }
.rail-i .tx b{ display:block; font-size:12px; font-weight:600; }
.rail-i .tx i{
  display:block; margin-top:2px; font-style:normal; font-size:10px; line-height:1.45;
  color:var(--muted); opacity:.8;
}

/* The footnote shelf: pinned to the floor of the rail, ruled off from the menu. */
.rail-foot{
  margin-top:auto; padding:12px 10px 4px;
  border-top:1px solid var(--border);
  display:flex; flex-direction:column; gap:10px;
}
.rail-foot .fn{ font-size:10.5px; line-height:1.6; color:var(--muted); }
.rail-foot .fn b{ display:block; margin-bottom:3px; font-weight:700; }
.rail-foot .fn.share b{ color:var(--accent); }
.rail-foot .fn.cond b{ color:var(--gold); }
.rail-foot .fn.plain b{ color:var(--ink); }

.pop-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.main-head{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:11px 16px; border-bottom:1px solid var(--border-soft);
}
.main-head h3{ margin:0; font-size:13px; font-weight:700; color:var(--ink); }
.main-head .sp{ flex:1; }
.main-scroll{ flex:1; min-height:0; overflow:auto; padding:15px 16px 18px; }

/* ── which button we are configuring ───────────────────────────────────────── */
.ops{ display:flex; gap:3px; padding:3px; background:var(--bg); border-radius:var(--r-sm); border:1px solid var(--border-soft); }
.ops button{
  flex:1; border:0; background:none; color:var(--muted); cursor:pointer;
  font:600 11.5px var(--font); padding:7px 10px; border-radius:var(--r-xs);
  transition:.12s var(--ease); white-space:nowrap;
}
.ops button:hover{ color:var(--ink); }
.ops button.cur{ background:var(--surface-2); color:var(--ink); box-shadow:0 1px 0 oklch(0 0 0/.25); }

/* ── the chain, across the top ─────────────────────────────────────────────── */
.chainflow{
  display:flex; align-items:stretch; flex-wrap:wrap; gap:6px;
  padding:11px; border-radius:var(--r-sm); background:var(--bg); border:1px solid var(--border-soft);
}
.node{
  display:flex; flex-direction:column; gap:3px; align-items:flex-start;
  padding:8px 12px; border-radius:var(--r-sm);
  border:1px solid var(--border); background:var(--surface-2); cursor:pointer;
  transition:.12s var(--ease); text-align:left;
}
.node:hover{ border-color:var(--muted); }
.node.cur{ border-color:var(--primary); background:var(--primary-soft); }
.node.plain{ cursor:default; opacity:.62; }
.node b{ font:700 11px var(--font); color:var(--ink); }
.node span{ font-size:9.5px; color:var(--muted); }
.node .cond{ color:var(--gold); }
.arr{ flex:0 0 auto; align-self:center; width:20px; display:flex; align-items:center; justify-content:center; color:var(--border); }
.arr svg{ width:18px; height:12px; }

/* ── the row under the chain: where it lives | how it falls back ──────────── */
.apirow{ display:flex; gap:13px; margin-top:13px; align-items:flex-start; }

/* A thumbnail, not a panel: it answers "which button" at a glance and gets out of
   the way. The full-size crop is a hover away. */
.shot{
  flex:0 0 auto; width:118px; margin:0;
  border:1px solid var(--border); border-radius:var(--r-sm); background:var(--bg);
  overflow:hidden; cursor:zoom-in; transition:.12s var(--ease);
}
.shot:hover{ border-color:var(--primary); }
.shot img{ display:block; width:100%; aspect-ratio:1/1; object-fit:cover; }
.shot figcaption{
  padding:6px 7px 7px; border-top:1px solid var(--border-soft); background:var(--surface-2);
  font:700 9px var(--font); letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  text-align:center; line-height:1.35;
}
/* Fixed, so the scrolling canvas cannot clip it. */
.shot-zoom{
  position:fixed; z-index:90; pointer-events:none;
  width:340px; border:1px solid var(--primary); border-radius:var(--r-sm);
  background:var(--bg); box-shadow:var(--shadow); overflow:hidden;
}
.shot-zoom img{ display:block; width:100%; aspect-ratio:1/1; object-fit:cover; }
.shot-zoom .cap{
  padding:9px 11px 10px; border-top:1px solid var(--border-soft); background:var(--surface-2);
}
.shot-zoom .cap b{ display:block; font:700 10px var(--font); letter-spacing:.06em; text-transform:uppercase; color:var(--ink); }
.shot-zoom .cap i{ display:block; margin-top:4px; font-style:normal; font-size:10.5px; line-height:1.55; color:var(--muted); }

/* Wide enough for three selects and a name, and no wider — the row should not grow
   just because the window did. */
.ladderwrap{ flex:1 1 0; min-width:0; max-width:640px; display:flex; flex-direction:column; gap:9px; }
.lad-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.lad-head b{ font:700 12px var(--font); color:var(--ink); }
.lad-head .sp{ flex:1; }
.lad-note{
  font-size:10.5px; line-height:1.55; color:var(--muted);
  padding:8px 10px; border-radius:var(--r-xs);
  background:var(--surface-2); border:1px solid var(--border-soft);
}
.lad-note.cond{ border-color:oklch(.78 .12 85 / .4); }
.lad-note.cond b{ color:var(--gold); font-weight:700; }
.lad-note.share{ border-color:color-mix(in srgb, var(--accent) 40%, transparent); }
.lad-note.share b{ color:var(--accent); font-weight:700; }
.pill.share{ color:var(--accent); }

.lad{ display:flex; flex-direction:column; gap:5px; }
.step{
  display:flex; align-items:center; gap:6px;
  padding:7px 8px; border-radius:var(--r-xs);
  background:var(--surface-2); border:1px solid var(--border-soft);
}
.step .n{
  flex:0 0 auto; width:17px; height:17px; border-radius:var(--pill);
  display:flex; align-items:center; justify-content:center;
  font:700 9px var(--font); color:var(--muted); background:var(--bg); border:1px solid var(--border);
}
.step.first .n{ color:var(--primary-ink); background:var(--primary); border-color:var(--primary); }
.step select.f{ min-width:0; }
.step select.agg{ flex:0 0 108px; }
.step select.mod{ flex:1 1 0; }
.step select.tier{ flex:0 0 84px; }
.step .grip{ flex:0 0 auto; color:var(--border); cursor:grab; user-select:none; letter-spacing:-1px; font-size:11px; }
.step.bad{ border-color:oklch(.66 .19 25 / .42); background:oklch(.66 .19 25 / .06); }
.step .skip{
  flex:0 0 auto; font:700 9px var(--font); letter-spacing:.07em; text-transform:uppercase;
  color:var(--danger); border:1px solid currentColor; border-radius:var(--pill);
  padding:2px 7px; cursor:help; white-space:nowrap;
}

/* ── key health ────────────────────────────────────────────────────────────── */
/* One line, always. A status strip that wraps reads as three separate notices.
   It sits in the section title bar, so it carries no chrome of its own. */
.health{
  display:flex; align-items:center; flex-wrap:nowrap; gap:13px;
  overflow-x:auto; min-width:0;
}
.health .k{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink); white-space:nowrap; }
.health .dot{ width:7px; height:7px; border-radius:var(--pill); flex:0 0 auto; }
.health .k.up   .dot{ background:var(--success); }
.health .k.down .dot{ background:var(--danger); }
.health .k.down { color:var(--danger); }
.health .d{ font-size:10px; color:var(--muted); white-space:nowrap; }
.health .sp{ flex:1; min-width:8px; }
.health .when{ font-size:10px; color:var(--muted); opacity:.8; white-space:nowrap; }
.health .recheck{
  flex:0 0 auto; border:1px solid var(--border); border-radius:var(--r-xs); background:var(--surface-2);
  color:var(--muted); font:600 10px var(--font); padding:4px 9px; cursor:pointer; white-space:nowrap;
}
.health .recheck:hover{ color:var(--ink); border-color:var(--muted); }

select.f{
  height:28px; padding:0 6px; cursor:pointer; max-width:100%;
  border:1px solid var(--border); border-radius:var(--r-xs);
  background:var(--surface); color:var(--ink); font:600 11.5px/26px var(--font);
}
select.f:hover{ border-color:var(--primary); }
select.f:disabled{ opacity:.55; cursor:default; }

.tinybtn{
  flex:0 0 auto; width:20px; height:20px; padding:0;
  border:1px solid var(--border); border-radius:var(--r-xs);
  background:var(--bg); color:var(--muted); cursor:pointer; font:400 11px/1 var(--font);
  transition:.12s var(--ease);
}
.tinybtn:hover:not(:disabled){ color:var(--danger); border-color:var(--danger); }
.tinybtn:disabled{ opacity:.3; cursor:default; }

.addstep{
  display:flex; align-items:center; justify-content:center; gap:8px;
  border:1px dashed var(--border); border-radius:var(--r-xs); background:none;
  color:var(--muted); font:600 11px var(--font); padding:8px; cursor:pointer;
  transition:.12s var(--ease);
}
.addstep:hover:not(:disabled){ color:var(--ink); border-color:var(--muted); }
.addstep:disabled{ opacity:.4; cursor:default; }
.addstep .cnt{ font-size:10px; opacity:.75; font-variant-numeric:tabular-nums; }

/* the one action allowed to live in a settings popup, because it has nowhere else */
.action{
  margin-top:3px; padding:11px 12px; border-radius:var(--r-sm);
  background:var(--bg); border:1px solid var(--border);
  display:flex; align-items:center; gap:11px;
}
.action .tx{ flex:1; min-width:0; }
.action .tx b{ display:block; font:700 11px var(--font); color:var(--ink); }
.action .tx i{ display:block; margin-top:3px; font-style:normal; font-size:10px; line-height:1.5; color:var(--muted); }
.gobtn{
  flex:0 0 auto; padding:8px 14px; border-radius:var(--r-xs); cursor:pointer;
  border:1px solid var(--primary); background:var(--primary); color:var(--primary-ink);
  font:700 11.5px var(--font); transition:.12s var(--ease);
}
.gobtn:hover{ filter:brightness(1.08); }

.pill{
  display:inline-block; font:700 9px var(--font); letter-spacing:.07em; text-transform:uppercase;
  padding:2px 7px; border-radius:var(--pill); border:1px solid currentColor; white-space:nowrap;
}
.pill.lock{ color:var(--gold); }
.pill.dim{ color:var(--muted); }
.pill.ok{ color:var(--success); }
.note{ font-size:10.5px; line-height:1.55; color:var(--muted); opacity:.85; }
.sec-t{ display:flex; align-items:center; gap:8px; font:700 10px var(--font); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.sec-t::after{ content:''; flex:1; height:1px; background:var(--border-soft); }
.card{ padding:13px; border-radius:var(--r-sm); background:var(--surface-2); border:1px solid var(--border-soft); }
.stack{ display:flex; flex-direction:column; gap:11px; }
.row{ display:flex; align-items:center; gap:9px; }
.lbl{ font:700 9.5px var(--font); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }

/* ── prompts ───────────────────────────────────────────────────────────────── */
.pr-list{ display:flex; flex-direction:column; gap:6px; }
.pr{
  display:flex; align-items:center; gap:9px; padding:9px 11px;
  border-radius:var(--r-sm); background:var(--surface-2); border:1px solid var(--border-soft);
  cursor:pointer; transition:.12s var(--ease);
}
.pr:hover{ border-color:var(--muted); }
.pr.cur{ border-color:var(--primary); background:var(--primary-soft); }
.pr .tx{ flex:1; min-width:0; }
.pr .tx b{ display:block; font:600 12px var(--font); color:var(--ink); }
.pr .tx i{ display:block; margin-top:2px; font-style:normal; font-size:10px; color:var(--muted); }
.pr-edit{
  width:100%; min-height:230px; resize:vertical;
  padding:11px; border-radius:var(--r-sm);
  background:var(--bg); border:1px solid var(--border); color:var(--ink);
  font:12px/1.6 ui-monospace,"Cascadia Mono",Consolas,monospace;
}
.pr-edit:focus{ outline:none; border-color:var(--primary); }

.ltable{ width:100%; border-collapse:collapse; }
.ltable th{
  font:700 9.5px var(--font); letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  text-align:left; padding:0 8px 7px; border-bottom:1px solid var(--border);
}
.ltable td{ padding:7px 8px; border-bottom:1px solid var(--border-soft); vertical-align:middle; font-size:11.5px; }
.ltable tr:last-child td{ border-bottom:0; }
</style>
</head>
<body data-mode="view">

<nav class="sv3-nav">
  <a href="/character" class="cur">Character</a>
  <a href="/scenarios">Scenarios</a>
  <a href="/merge">Merge</a>
  <a href="/birols">Birols</a>
  <span class="sp"></span>
  <button class="nav-gear is-on" id="gear" title="Character settings" aria-label="Character settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>

  </button>

</nav>

<div class="mock-stage">
  <div class="mock-hint">
    The Character page sits here &mdash; without the two column gears.<br>
    Everything they held is in the popup.
  </div>
</div>

<div class="pop-back" id="back">
  <div class="pop">

    <div class="pop-head">
      <h2>Character settings</h2>
      <span class="sub">How this page generates</span>
      <span class="sp"></span>
      <span class="saves">Changes save as you make them</span>
      <button class="pop-x" id="close" aria-label="Close">&times;</button>
    </div>

    <div class="pop-body">

      <div class="pop-rail">
        <div class="rail-t">Character</div>

        <button class="rail-i cur" data-sec="api">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h4l3-7 4 14 3-7h2"/></svg></span>
          <span class="tx"><b>API</b><i>Who is asked, what draws it, and what happens when that fails</i></span>
        </button>

        <button class="rail-i" data-sec="prompts">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg></span>
          <span class="tx"><b>Prompts</b><i>Rewrite the system prompt behind any step</i></span>
        </button>

        <div class="rail-t">Page</div>

        <button class="rail-i" data-sec="defaults">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 14h5"/></svg></span>
          <span class="tx"><b>Defaults</b><i>Aspect, realism markers, what Create opens with</i></span>
        </button>

        <button class="rail-i" data-sec="log">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          <span class="tx"><b>Attempt log</b><i>What every step answered on the last run</i></span>
        </button>

        <!-- The footnotes live down here rather than inside the ladder: they are the
             same words either way, and a paragraph above every ladder pushed the
             controls down the screen for no gain. -->
        <div class="rail-foot" id="railnotes" hidden></div>
      </div>

      <div class="pop-main">
        <div class="main-head">
          <h3 id="mainh">Generation chain</h3>
          <span class="sp"></span>
          <div class="health" id="mainhealth"></div>
        </div>
        <div class="main-scroll" id="canvas"></div>
      </div>

    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ── the real matrix, per direction, so a counter can be honest ─────────── */
  const AGGS = ['Replicate', 'kie.ai', 'OpenRouter'];
  const ENGINES = {
    'z-image-turbo':        { tiers:['1K','2K'],                     on:{ 'Replicate':['t2i'] } },
    'nano-banana-2':        { tiers:['1K','2K','4K'],                on:{ 'Replicate':['t2i','i2i'], 'kie.ai':['t2i','i2i'], 'OpenRouter':['t2i','i2i'] } },
    'seedream-4.5':         { tiers:['2K','4K'],                     on:{ 'Replicate':['t2i','i2i'], 'kie.ai':['t2i'],       'OpenRouter':['t2i','i2i'] } },
    'gpt-image-2':          { tiers:['low','medium','high'],         on:{ 'Replicate':['t2i','i2i'], 'kie.ai':['t2i','i2i'], 'OpenRouter':['t2i','i2i'] } },
    'seedream-5-lite':      { tiers:['2K','3K'],                     on:{ 'Replicate':['t2i','i2i'] } },
    'flux-2-max':           { tiers:['0.5 MP','1 MP','2 MP','4 MP'], on:{ 'Replicate':['t2i','i2i'] } },
    'qwen-image-edit-plus': { tiers:['standard'],                    on:{ 'Replicate':['i2i'] } },
  };
  /* ── Language models ──────────────────────────────────────────────────────
     Every id below answered a live call with this page's own prompt and returned
     the same {ok, who, change} shape. kie.ai's ids carry the -openai suffix
     because the bare spellings answer "The model is not supported" — inside an
     HTTP 200, so a naive caller reads the refusal as an empty answer.

     Vision and text are separate lists on purpose: the Create step has no photo,
     so a vision model there would be asked to look at nothing. */
  const LLM = {
    vision: {
      'kie.ai': ['gemini-2.5-flash', 'gemini-3-5-flash-openai', 'gemini-3-6-flash-openai',
                 'gemini-3-7-flash-openai', 'gemini-3-flash'],
      'OpenRouter': ['google/gemini-2.5-flash', 'google/gemini-3.1-flash-lite',
                     'google/gemini-3.7-flash', 'openai/gpt-5.6-luna'],
      'Replicate': ['google/gemini-2.5-flash', 'google/gemini-3-flash',
                    'google/gemini-3.5-flash', 'openai/gpt-5.6-luna'],
    },
    text: {
      'kie.ai': ['gemini-2.5-flash', 'gemini-3-5-flash-openai', 'gemini-3-6-flash-openai',
                 'gemini-3-7-flash-openai', 'gemini-3-flash'],
      'OpenRouter': ['google/gemini-2.5-flash', 'google/gemini-3.1-flash-lite',
                     'google/gemini-3.7-flash', 'openai/gpt-5.6-luna'],
      'Replicate': ['google/gemini-2.5-flash', 'google/gemini-3-flash',
                    'google/gemini-3.5-flash', 'openai/gpt-5.6-luna'],
    },
  };
  /* Alphabetical, case-insensitive — the ladder's own order is priority and is never
     sorted, but a dropdown the user reads should be in the order a list is read. */
  const alpha = (a, b) => String(a).toLowerCase().localeCompare(String(b).toLowerCase());
  Object.values(LLM).forEach(byAgg => Object.values(byAgg).forEach(l => l.sort(alpha)));

  /* ── Key health ───────────────────────────────────────────────────────────
     Re-checked every 30 minutes against each provider's own free endpoint —
     kie /api/v1/chat/credit, OpenRouter /api/v1/key, Replicate /v1/account —
     so a dead key is found by asking, not by a generation failing.
     An aggregator whose key is refused cannot be chosen: its options are
     disabled rather than hidden, because the key coming back should put the
     choice back exactly where it was. */
  const HEALTH = {
    'kie.ai':     { ok:true,  detail:'47 279 cr' },
    'OpenRouter': { ok:true,  detail:'active' },
    'Replicate':  { ok:false, detail:'401 rejected' },
  };
  const CHECKED = '4 min ago';
  const alive = (a) => !HEALTH[a] || HEALTH[a].ok !== false;

  /* Which aggregators can serve this step at all. */
  function aggsFor(st) {
    if (st.kind === 'img') {
      return AGGS.filter(a => Object.keys(ENGINES).some(e =>
        (!st.lock || e === st.lock) && (ENGINES[e].on[a] || []).includes(st.dir))).sort(alpha);
    }
    return Object.keys(LLM[st.kind] || {}).sort(alpha);
  }
  function modelsFor(st, agg) {
    if (st.kind === 'img') {
      return Object.keys(ENGINES).filter(e =>
        (!st.lock || e === st.lock) && (ENGINES[e].on[agg] || []).includes(st.dir)).sort(alpha);
    }
    return ((LLM[st.kind] || {})[agg] || []).slice();
  }
  /* Every pairing that could ever be a step here. The ladder cannot be longer than
     this, and a repeated pairing is a step that fails the same way twice. */
  function allPairs(st) {
    const out = [];
    aggsFor(st).forEach(a => modelsFor(st, a).forEach(m => out.push(a + '|' + m)));
    return out;
  }
  const tiersFor = (st, model) => (st.kind === 'img' && ENGINES[model]) ? ENGINES[model].tiers : null;

  /* ── the three buttons on the page, and what each one sets off ──────────── */
  const OPS = {
    create: {
      label: 'Create',
      shot: '/img/cv2-help/create.webp',
      shotT: 'The Create button',
      shotN: 'Top of the Create column. Builds a portrait from the parameters alone — no reference photo.',
      stages: [
        { kind:'start', name:'Create', sub:'button' },
        { id:'prompt', kind:'text', name:'House prompt', sub:'presets + your own words',
          conditional:'The house template is assembled in the page — no model, no cost. This ladder only runs when you have typed something of your own into the prompt, and then it is a model that folds your words into the template. No photo is involved, so this list is text models.',
          rungs:[ ['OpenRouter','nvidia/nemotron-3.5-lightning',''] ] },
        { id:'draw', kind:'img', dir:'t2i', name:'Draw', sub:'text to image',
          rungs:[ ['Replicate','z-image-turbo','2K'] ] },
        { kind:'fixed', name:'Poll', sub:'until it lands' },
        { kind:'end', name:'Portrait', sub:'result' },
      ],
    },
    reference: {
      label: 'From reference',
      shot: '/img/cv2-help/reference.webp',
      shotT: 'The reference source',
      shotN: 'Bottom of the Create column. TPDNE or your own upload — the photo the portrait is built from.',
      stages: [
        { kind:'start', name:'Generate', sub:'button' },
        { id:'analyze', kind:'vision', name:'Analyze', sub:'photo + your words',
          note:'Reads the reference against whatever you typed and answers with prompt material. Can refuse — and a refusal costs no generation.',
          rungs:[ ['OpenRouter','google/gemini-3.1-flash-lite',''] ] },
        { kind:'fixed', name:'Assemble', sub:'house template + who' },
        { id:'draw', kind:'img', dir:'i2i', name:'Draw', sub:'image to image',
          rungs:[ ['Replicate','nano-banana-2','2K'] ] },
        { kind:'fixed', name:'Poll', sub:'until it lands' },
        { kind:'end', name:'Portrait', sub:'result' },
      ],
    },
    /* Edit is a fourth BUTTON but not a fourth pipeline. main.js calls one function,
       _fromText(), from both the reference panel and the edit panel — the app's own
       comment on it reads "one pipeline, two ways in". Only two things differ:
       the prompt template (refEditPrompt vs genPromptFrom) and the aspect
       (match_input_image vs 3:2). The ladders are literally the same arrays below,
       so a change made here shows up there — which is what the code already does. */
    edit: {
      label: 'Edit',
      shot: '/img/cv2-help/edit.webp',
      shotT: 'The Edit button',
      shotN: 'The Create column turns into this once a portrait exists: trait chips, a field for your own words, and Edit on the floor.',
      stages: [
        { kind:'start', name:'Edit', sub:'button' },
        { id:'analyze', kind:'vision', name:'Analyze', sub:'portrait + your words', shared:'From reference',
          note:'The same analyzer, reading the portrait you already have against the chips and words you typed. A refusal is shown where a failure would be, and costs no generation.',
          rungs:null },
        { kind:'fixed', name:'Assemble', sub:'refEditPrompt · keeps the frame' },
        { id:'draw', kind:'img', dir:'i2i', name:'Draw', sub:'image to image · match input', shared:'From reference',
          rungs:null },
        { kind:'fixed', name:'Poll', sub:'until it lands' },
        { kind:'end', name:'Portrait', sub:'result' },
      ],
    },
    sheet: {
      label: 'Save character',
      shot: '/img/cv2-help/sheet.webp',
      shotT: 'The Save character button',
      shotN: 'Bottom of the Portrait column. Produces the 4K sheet every later generation points at.',
      stages: [
        { kind:'start', name:'Save char', sub:'button' },
        { id:'framing', kind:'vision', name:'Read the framing', sub:'is the body in shot?',
          note:'Decides whether the sheet prompt says preserve the build or construct it. Non-fatal: if nothing answers, the sheet still generates with the old wording.',
          rungs:[ ['OpenRouter','google/gemini-3.1-flash-lite',''] ] },
        { kind:'fixed', name:'Sheet prompt', sub:'CHAR_SHEET_PROMPT' },
        { id:'draw', kind:'img', dir:'i2i', name:'Draw the sheet', sub:'16:9 · 4K',
          note:'The engine is open here by your call. Worth knowing what it buys: every scene is later built from this sheet, so a fallback that draws it with a different model can hand back a character who no longer looks like themselves — which is why the attempt log records which step actually produced it.',
          rungs:[ ['Replicate','nano-banana-2','4K'], ['OpenRouter','nano-banana-2','4K'], ['kie.ai','nano-banana-2','4K'] ] },
        { kind:'fixed', name:'Poll', sub:'until it lands' },
        { kind:'end', name:'4K sheet', sub:'result' },
      ],
    },
  };

  /* Edit borrows From reference's ladders by REFERENCE, not by copy: they are one
     setting in the code, so they must be one array here — otherwise the mock would
     promise an independence the app does not have. */
  OPS.edit.stages[1].rungs = OPS.reference.stages[1].rungs;
  OPS.edit.stages[3].rungs = OPS.reference.stages[3].rungs;

  const PROMPTS = [
    { id:'CV2_HOUSE_TEMPLATE', name:'House template', used:'Create → house prompt',
      body:'The framing, backdrop, neutral wardrobe and realism markers every Create portrait is built from. Assembled in the page from presets.js, so there is one definition of the house look.' },
    { id:'CV2_APPEARANCE_PROMPT', name:'Appearance analyzer', used:'From reference → analyze',
      body:'You prepare prompt material for an image generator from a reference photo of a person.\n\nThe user’s request (may be empty, may be in any language):\n"""{USER_TEXT}"""\n\nAnswer with ONE JSON object and nothing else. Either:\n{"ok":true,"who":"...","change":"..."}\nor, if the request cannot be honoured:\n{"ok":false,"reason":"one short sentence in English"}' },
    { id:'CV2_FRAMING_PROMPT', name:'Framing agent', used:'Save character → read the framing',
      body:'You are looking at a reference photo of a person that will be turned into a character sheet showing their whole body from three angles.\n\nAnswer with ONE JSON object and nothing else:\n{"full":true,"visible":"...","figure":"..."}' },
    { id:'CHAR_SHEET_PROMPT', name:'Character sheet', used:'Save character → draw the sheet',
      body:'Single combined character reference sheet of the SAME person from the reference image, everything on ONE wide sheet over a pure white seamless background, arranged side by side…' },
  ];

  const ARROW = '<span class="arr"><svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h18M15 1l5 5-5 5"/></svg></span>';
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  /* `dead` marks single options unselectable — used for an aggregator whose key was
     refused. Disabled and labelled, not removed: the option is still the truth about
     what exists, and the key coming back should not need the choice rebuilding. */
  const sel = (opts, cur, cls, dis, dead) => '<select class="f ' + (cls || '') + '"' + (dis ? ' disabled' : '') + '>'
    + opts.map(o => {
        const why = dead ? dead(o) : null;
        return '<option' + (o === cur ? ' selected' : '') + (why ? ' disabled' : '') + '>'
          + esc(o) + (why ? '  — ' + why : '') + '</option>';
      }).join('') + '</select>';

  let SEC = 'api', OP = 'create', NODE = null, PROMPT = 0;

  const stageOf = (op) => {
    const s = OPS[op].stages;
    if (NODE != null && s[NODE] && s[NODE].rungs) return NODE;
    return s.findIndex(x => x.rungs);
  };

  function chain(op) {
    const cur = stageOf(op);
    let h = '<div class="chainflow">';
    OPS[op].stages.forEach((st, i) => {
      if (i) h += ARROW;
      const on = !!st.rungs;
      const sub = on
        ? (st.conditional ? '<span class="cond">conditional · ' + st.rungs.length + '</span>'
                          : st.rungs[0][0] + (st.rungs.length > 1 ? ' + ' + (st.rungs.length - 1) : ''))
        : st.sub;
      h += '<button class="node' + (on ? '' : ' plain') + (i === cur ? ' cur' : '') + '"'
        + (on ? ' data-node="' + i + '"' : '') + '><b>' + st.name + '</b><span>' + sub + '</span></button>';
    });
    return h + '</div>';
  }

  function ladder(st) {
    const pairs = allPairs(st);
    const used = new Set(st.rungs.map(r => r[0] + '|' + r[1]));
    const left = pairs.length - used.size;
    /* Three by default is plenty, and every extra rung is spent WAITING: a refusal
       from one aggregator was measured at 4s, a timeout from another at 189s. */
    const capped = st.rungs.length >= 5;

    let h = '<div class="lad-head"><b>' + st.name + '</b>'
      + (st.lock ? '<span class="pill lock">engine locked</span>' : '')
      + (st.shared ? '<span class="pill share">shared with ' + st.shared + '</span>' : '')
      + '<span class="sp"></span><span class="note">' + st.sub + '</span></div>';

    /* The footnotes used to sit here. They are on the rail's floor now — same words,
       and the controls start at the top of the panel instead of below a paragraph. */

    const deadAgg = (a) => alive(a) ? null : 'key refused';

    h += '<div class="lad">';
    st.rungs.forEach((r, k) => {
      const aggs = aggsFor(st);
      const mods = modelsFor(st, r[0]);
      const tiers = tiersFor(st, r[1]);
      const down = !alive(r[0]);
      h += '<div class="step' + (k === 0 ? ' first' : '') + (down ? ' bad' : '') + '">'
        + '<span class="grip">&#8942;&#8942;</span><span class="n">' + (k + 1) + '</span>'
        + sel(aggs, r[0], 'agg', false, deadAgg) + sel(mods, r[1], 'mod', !!st.lock)
        + (tiers ? sel(tiers, r[2], 'tier') : '')
        + (down ? '<span class="skip" title="' + esc(HEALTH[r[0]].detail) + '">skipped</span>' : '')
        + '<button class="tinybtn" title="Remove this step"' + (st.rungs.length < 2 ? ' disabled' : '') + '>&minus;</button>'
        + '</div>';
    });
    h += '</div>';

    const dead = st.rungs.filter(r => !alive(r[0])).length;
    if (dead) {
      h += '<p class="note">' + dead + ' step' + (dead === 1 ? '' : 's') + ' point at an aggregator whose key is '
        + 'refused right now. They stay in the ladder and are stepped over until the key answers again.</p>';
    }

    /* Two different reasons to stop, and they are not the same news: one says the
       matrix is exhausted, the other says we chose to stop before it was. */
    const why = left < 1
      ? 'every pairing is already in the ladder'
      : capped ? 'five is the cap — more steps buy waiting, not reliability'
      : left + ' pairing' + (left === 1 ? '' : 's') + ' unused';
    h += '<button class="addstep"' + (left < 1 || capped ? ' disabled' : '') + '>'
      + '<span>+ add a fallback step</span>'
      + '<span class="cnt">' + st.rungs.length + ' of ' + Math.min(5, pairs.length) + ' · ' + why + '</span></button>';
    return h;
  }

  function viewApi() {
    const op = OPS[OP];
    const st = op.stages[stageOf(OP)];
    let h = '<div class="stack">';
    h += '<div class="ops">' + Object.keys(OPS).map(k =>
      '<button data-op="' + k + '"' + (k === OP ? ' class="cur"' : '') + '>' + OPS[k].label + '</button>').join('') + '</div>';

    h += chain(OP);
    h += '<div class="apirow">'
      + '<figure class="shot" data-shot="' + esc(op.shot) + '" data-t="' + esc(op.shotT)
      + '" data-n="' + esc(op.shotN) + '" title="Hover to enlarge">'
      + '<img src="' + op.shot + '" alt="' + esc(op.shotT) + ' on the Character page">'
      + '<figcaption>' + op.shotT.replace(/^The /, '') + '</figcaption></figure>'
      + '<div class="ladderwrap">' + ladder(st) + '</div>'
      + '</div>';
    /* Regenerate used to live here. It is an action, not a setting, and it belongs
       where the thing it acts on is — beside Save character on the page. */
    h += '<p class="note">Each step is tried in order: aggregator, then the model it can serve, then that '
      + 'model’s own tier. If a step fails, the next one runs. If none do, the attempt log says what each answered.</p>';
    return h + '</div>';
  }

  function viewPrompts() {
    const p = PROMPTS[PROMPT];
    let h = '<div class="stack"><div class="pr-list">';
    PROMPTS.forEach((x, i) => {
      h += '<div class="pr' + (i === PROMPT ? ' cur' : '') + '" data-pr="' + i + '">'
        + '<span class="tx"><b>' + x.name + '</b><i>' + x.used + '</i></span>'
        + '<span class="pill dim">' + x.id + '</span></div>';
    });
    h += '</div><textarea class="pr-edit" spellcheck="false">' + esc(p.body) + '</textarea>'
      + '<p class="note">Edited here, used everywhere that step runs. API says which stage each prompt belongs to.</p></div>';
    return h;
  }

  function viewDefaults() {
    return '<div class="stack">'
      + '<div class="card"><div class="sec-t">Create opens with</div>'
      + '<div class="row" style="margin-top:11px"><span class="lbl" style="flex:0 0 118px">Aspect</span>' + sel(['3:2','match input','9:16','1:1'], '3:2') + '</div>'
      + '<div class="row" style="margin-top:8px"><span class="lbl" style="flex:0 0 118px">Realism</span>' + sel(['house markers','none','custom'], 'house markers') + '</div></div>'
      + '<div class="card"><div class="sec-t">After a sheet run</div>'
      + '<div class="row" style="margin-top:11px"><span class="lbl" style="flex:0 0 118px">Reset</span>'
      + sel(['step 1 back to nano-banana-2','the whole ladder','nothing'], 'step 1 back to nano-banana-2') + '</div>'
      + '<p class="note" style="margin-top:9px">A one-off try of another engine should not quietly draw every future character. '
      + 'The aggregator is kept either way — whichever one is up today is still up on the next run.</p></div>'
      + '<div class="card"><div class="sec-t">Regenerate a saved character</div>'
      + '<p class="note" style="margin-top:9px">Uses the ladder as it stands now, not the one the character was originally made with.</p></div>'
      + '</div>';
  }

  function viewLog() {
    const rows = [
      ['Analyze', 'OpenRouter · qwen3.7-plus', 'ok', '1.9s'],
      ['Draw', 'Replicate · nano-banana-2', 'ModelRateLimitError (E003)', '4.1s'],
      ['Draw', 'OpenRouter · nano-banana-2', 'ok', '16.4s'],
    ];
    let h = '<div class="stack"><div class="card"><div class="sec-t">Last run — From reference</div>'
      + '<table class="ltable" style="margin-top:11px"><thead><tr><th>Stage</th><th>Step</th><th>Answer</th><th>Took</th></tr></thead><tbody>';
    rows.forEach(r => {
      h += '<tr><td class="note">' + r[0] + '</td><td>' + r[1] + '</td>'
        + '<td>' + (r[2] === 'ok' ? '<span class="pill ok">ok</span>' : '<span class="note">' + r[2] + '</span>') + '</td>'
        + '<td class="note">' + r[3] + '</td></tr>';
    });
    h += '</tbody></table></div><p class="note">Kept per button. When a whole ladder is exhausted this is what the page '
      + 'shows instead of one last error.</p></div>';
    return h;
  }

  const HEADS = { api:'Generation chain', prompts:'System prompts', defaults:'Page defaults', log:'Attempt log' };

  /* The footnotes for whatever is selected. Gathered here so the rail and the panel
     cannot disagree about which step is being explained. */
  function notesFor() {
    if (SEC !== 'api') return '';
    const st = OPS[OP].stages[stageOf(OP)];
    if (!st) return '';
    const out = [];
    if (st.shared) {
      out.push('<div class="fn share"><b>One setting, two buttons</b>The app runs a single pipeline '
        + 'for both — change this ladder and ' + st.shared + ' changes with it. Only the prompt '
        + 'template and the aspect differ between them.</div>');
    }
    if (st.conditional) {
      out.push('<div class="fn cond"><b>Runs only when you add your own words</b>' + st.conditional + '</div>');
    } else if (st.note) {
      out.push('<div class="fn plain"><b>' + st.name + '</b>' + st.note + '</div>');
    }
    return out.join('');
  }

  function healthHtml() {
    return Object.keys(HEALTH).sort(alpha).map(a =>
      '<span class="k ' + (HEALTH[a].ok ? 'up' : 'down') + '"><span class="dot"></span>' + a
      + ' <span class="d">' + HEALTH[a].detail + '</span></span>').join('')
      + '<span class="when">checked ' + CHECKED + '</span>'
      + '<button class="recheck">Check now</button>';
  }

  function render() {
    document.getElementById('mainh').textContent = HEADS[SEC];
    const c = document.getElementById('canvas');
    c.innerHTML = SEC === 'prompts' ? viewPrompts()
      : SEC === 'defaults' ? viewDefaults()
      : SEC === 'log' ? viewLog() : viewApi();

    // Key state belongs beside the section title: it is true of the whole popup,
    // not of the step that happens to be open.
    const hh = document.getElementById('mainhealth');
    hh.innerHTML = SEC === 'api' ? healthHtml() : '';
    hh.hidden = SEC !== 'api';

    const rn = document.getElementById('railnotes');
    const notes = notesFor();
    rn.innerHTML = notes;
    rn.hidden = !notes;
  }

  document.addEventListener('click', function (e) {
    const s = e.target.closest('.rail-i');
    if (s) { SEC = s.dataset.sec; document.querySelectorAll('.rail-i').forEach(b => b.classList.toggle('cur', b === s)); render(); return; }
    const o = e.target.closest('[data-op]');
    if (o) { OP = o.dataset.op; NODE = null; render(); return; }
    const n = e.target.closest('[data-node]');
    if (n) { NODE = parseInt(n.dataset.node, 10); render(); return; }
    const p = e.target.closest('[data-pr]');
    if (p) { PROMPT = parseInt(p.dataset.pr, 10); render(); return; }

    const add = e.target.closest('.addstep');
    if (add && !add.disabled) {
      const st = OPS[OP].stages[stageOf(OP)];
      const used = new Set(st.rungs.map(r => r[0] + '|' + r[1]));
      const spare = allPairs(st).filter(k => !used.has(k));
      /* A live aggregator first: adding a step that is skipped the moment it is
         added is not a fallback, it is a row. */
      const free = spare.find(k => alive(k.split('|')[0])) || spare[0];
      if (free) {
        const [a, m] = free.split('|');
        const t = tiersFor(st, m);
        st.rungs.push([a, m, t ? (st.rungs[0][2] && t.includes(st.rungs[0][2]) ? st.rungs[0][2] : t[t.length - 1]) : '']);
        render();
      }
      return;
    }
    const rm = e.target.closest('.tinybtn');
    if (rm && !rm.disabled) {
      const st = OPS[OP].stages[stageOf(OP)];
      const i = [...rm.closest('.lad').children].indexOf(rm.closest('.step'));
      if (i >= 0 && st.rungs.length > 1) { st.rungs.splice(i, 1); render(); }
      return;
    }
    if (e.target.id === 'close') { document.getElementById('back').style.display = 'none'; return; }
    if (e.target.closest('#gear')) { document.getElementById('back').style.display = 'flex'; return; }
  });

  /* ── the hover preview ────────────────────────────────────────────────────
     Fixed position, worked out from the thumbnail, and clamped to the window so a
     crop near the bottom does not open off-screen. */
  let ZOOM = null;
  function closeZoom() { if (ZOOM) { ZOOM.remove(); ZOOM = null; } }

  document.addEventListener('mouseover', function (e) {
    const fig = e.target.closest ? e.target.closest('.shot') : null;
    if (!fig) { if (ZOOM && !e.target.closest('.shot-zoom')) closeZoom(); return; }
    if (ZOOM && ZOOM.dataset.for === fig.dataset.shot) return;
    closeZoom();

    const z = document.createElement('div');
    z.className = 'shot-zoom';
    z.dataset.for = fig.dataset.shot;
    z.innerHTML = '<img src="' + fig.dataset.shot + '" alt="">'
      + '<div class="cap"><b>' + esc(fig.dataset.t) + '</b><i>' + esc(fig.dataset.n) + '</i></div>';
    document.body.appendChild(z);

    const r = fig.getBoundingClientRect();
    const h = z.offsetHeight, w = z.offsetWidth;
    let top = r.top + r.height / 2 - h / 2;
    top = Math.max(10, Math.min(window.innerHeight - h - 10, top));
    /* Left first: the thumbnail sits at the left edge of the canvas, so opening to
       the right would cover the ladder — the one thing you are looking at. */
    let left = r.left - w - 10;
    if (left < 10) left = Math.min(window.innerWidth - w - 10, r.right + 10);
    z.style.top = top + 'px';
    z.style.left = left + 'px';
    ZOOM = z;
  });
  document.addEventListener('mouseout', function (e) {
    const to = e.relatedTarget;
    if (ZOOM && (!to || (!to.closest || (!to.closest('.shot') && !to.closest('.shot-zoom'))))) closeZoom();
  });
  document.addEventListener('scroll', closeZoom, true);

  /* Changing the aggregator changes which models exist, and the model changes which
     tiers exist. Repaired here rather than left to fail at submit. */
  document.addEventListener('change', function (e) {
    if (e.target.tagName !== 'SELECT') return;
    const stepEl = e.target.closest('.step');
    if (!stepEl) { render(); return; }
    const st = OPS[OP].stages[stageOf(OP)];
    const i = [...stepEl.parentNode.children].indexOf(stepEl);
    const r = st.rungs[i];
    if (!r) return;
    if (e.target.classList.contains('agg')) {
      r[0] = e.target.value;
      const mods = modelsFor(st, r[0]);
      if (!mods.includes(r[1])) r[1] = mods[0] || '';
    } else if (e.target.classList.contains('mod')) {
      r[1] = e.target.value;
    } else if (e.target.classList.contains('tier')) {
      r[2] = e.target.value;
    }
    const t = tiersFor(st, r[1]);
    if (t && !t.includes(r[2])) r[2] = t[Math.min(1, t.length - 1)];
    render();
  });

  render();
})();
</script>
</body>
</html>
