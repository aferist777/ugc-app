<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Character v2</title>
<!-- FIRST: hydrate localStorage from the server before page code runs, so which mode was
     open and which character was selected survive a browser or device change. -->
<script src="/js/storage-sync.js"></script>
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/app-nav.css">
<link rel="stylesheet" href="css/gen-progress.css">
<link rel="stylesheet" href="css/character-v2.css">
</head>
<body data-mode="view">

<!-- Working pages on the left, reference and status on the right - the same shape as every
     other page. Which entry is lit comes from the address (js/app-nav.js). -->
<nav class="sv3-nav">
  <a href="/character">Character</a>
  <a href="/scenarios">Scenarios</a>
  <a href="/merge">Merge</a>
  <span class="sp"></span>
  <!-- The gear is markup and nothing else: its panel - script, stylesheet and two API
       calls - is fetched the first time it is pressed. Most visits never open it. -->
  <button class="sv3-gear" id="cv2-settings-btn" title="Character settings" aria-label="Character settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <span class="tag" id="cv2-mode-tag">character view</span>
  <a href="/library">Library</a>
</nav>

<!-- FOUR columns, in a fixed order so a collapsed one keeps its place.
       1 create  - the creation flow. Collapses left when you are looking at a character.
       2 list    - the characters. Collapses left when you are creating one.
       3 work    - never collapses: it takes whatever the others give back.
       4 side    - the dynamic panel; opens on the selected character's looks for now.
     create and list are two states of ONE layout rather than two screens: expanding either
     collapses the other, so `view` and `create` are the same page in two positions. -->
<div id="cv2-cols">

  <section class="cv2-col is-collapsed" id="cv2-create">
    <div class="cv2-spine">Create</div>
    <div class="cv2-col-head">
      <span class="cv2-col-title">Create model</span>
      <!-- The column's own gear used to sit here, with its drawer below. Both are gone: which
           engine draws a portrait is now a ladder rather than a dropdown, and it is edited once
           for the whole page from the gear in the nav. -->
      <span class="sp"></span>
      <button class="cv2-x" type="button" data-collapse="cv2-create" title="Collapse">&#8249;</button>
    </div>
    <div class="cv2-col-body">
      <!-- Visible in BOTH states, which is why it sits outside the swappable panels: the name,
           and the buttons that only make sense while building by hand (hidden by CSS in ref). -->
      <div id="cv2-create-head-host"></div>
      <!-- main: the option dropdowns -->
      <div data-when="create-main" id="cv2-create-main-host"></div>
      <!-- ref: a face arrived from outside - TPDNE or the user's own upload - and is steered
           by words instead of dropdowns, because no dropdown describes it. -->
      <div data-when="create-ref" id="cv2-create-ref-host"></div>
      <!-- edit: the portrait the parameters just made, now being changed by chips and words.
           Entered the moment a generation lands, because that is when there is something to
           change; Cancel goes back to the parameters. -->
      <div data-when="create-edit" id="cv2-create-edit-host"></div>
      <!-- Also both states: TPDNE stays exactly where it was, and pressing it again swaps the
           face for another one. -->
      <div id="cv2-create-foot-host"></div>
    </div>
  </section>

  <section class="cv2-col" id="cv2-list">
    <div class="cv2-spine">Characters</div>
    <div class="cv2-col-head">
      <span class="cv2-col-title">Characters</span>
      <span class="cv2-count" id="cv2-count"></span>
      <span class="sp"></span>
      <button class="cv2-x" type="button" data-collapse="cv2-list" title="Collapse">&#8249;</button>
    </div>
    <div class="cv2-col-body">
      <!-- Saved are the finished characters; unsaved are the takes kept with a star, which still
           need their 4K sheet. Clicking one of those resumes it at exactly that step. -->
      <div class="cv2-filter" id="cv2-filter">
        <button class="cv2-filter-b is-on" type="button" data-filter="saved">Saved</button>
        <button class="cv2-filter-b" type="button" data-filter="unsaved">Unsaved</button>
      </div>
      <div class="cv2-list" id="cv2-chars"></div>
    </div>
  </section>

  <section class="cv2-col" id="cv2-work">
    <div class="cv2-col-head">
      <span class="cv2-col-title" id="cv2-work-title">Character</span>
      <span class="sp"></span>
      <span class="cv2-status" id="cv2-status"></span>
      <!-- The 4K sheet's gear used to sit here, where it could settle nothing until Save had
           been pressed. It lives in the save form's footer now, beside the button that spends
           it. Regenerating a sheet from view mode went with it, deliberately. -->
    </div>
    <div class="cv2-col-body">
      <!-- view: the big image, and to its right the strip that chooses what it shows - the 4K
           reference at the top, then every look, scrolling on its own because a character can
           have more looks than fit. Shrinking the image is what makes room for the voices
           underneath it. -->
      <div data-when="view">
        <div class="cv2-view">
          <!-- Left: the image, and the voices under it at the same width - they belong to the
               same thing, so they share a column. Right: the looks, full height. -->
          <div class="cv2-view-left">
            <div class="cv2-big" id="cv2-big"></div>
            <div class="cv2-view-foot" id="cv2-voice-host"></div>
          </div>
          <div class="cv2-strip" id="cv2-strip"></div>
        </div>
      </div>
      <!-- create: where a generated or fetched face lands -->
      <div data-when="create">
        <div class="cv2-drop" id="cv2-drop">
          <!-- A third of the image at each edge, for paging through the takes. Empty on purpose:
               the chevron is drawn by CSS, and they only appear once there are two to move between. -->
          <button class="cv2-page is-prev" type="button" id="cv2-prev" title="Previous take"></button>
          <button class="cv2-page is-next" type="button" id="cv2-next" title="Next take"></button>
          <div class="cv2-drop-hint" id="cv2-drop-hint">
            Nothing generated yet.<br>Set the parameters and generate, or take a random face with TPDNE.
            <br>You can also drop your own image here, or click to pick one.
          </div>
        </div>
        <!-- One row under the image: every take of this character on the left, newest first,
             and the way into the save stage hard against the right. They belong on the same
             line because they are the same decision - which take, and then keep it. -->
        <div class="cv2-mid-bar">
          <div class="cv2-vars" id="cv2-vars" hidden></div>
          <!-- Useless until there is a face, so disabled until one exists - and it steps aside
               during the save stage, where the form's own button is the one that commits. -->
          <div class="cv2-mid-foot" id="cv2-mid-foot">
            <button class="cv2-savemodel" type="button" id="cv2-savemodel" disabled
                    title="Name this character, give it a voice, generate its 4K sheet">Save character</button>
          </div>
        </div>
      </div>
      <!-- Outside both states on purpose: a failure has to be readable wherever you were
           standing when it happened. Under the reference sheet in view, under the portrait in
           create, and it stays until dismissed or until the next job starts. -->
      <div class="cv2-err" id="cv2-err" hidden></div>
    </div>
  </section>

  <section class="cv2-col" id="cv2-side">
    <div class="cv2-spine" id="cv2-side-spine">Looks</div>
    <div class="cv2-col-head">
      <span class="cv2-col-title" id="cv2-side-title">Looks</span>
      <span class="sp"></span>
      <button class="cv2-x" type="button" data-collapse="cv2-side" title="Collapse">&#8250;</button>
    </div>
    <div class="cv2-col-body">
      <!-- view: no longer the looks - those moved into the centre. This column is now the
           gallery of what Scenarios generated with whichever look is selected. -->
      <div data-when="view"><div class="cv2-gal" id="cv2-gal"></div></div>
      <!-- create: nothing. This column had a portrait that duplicated the middle one and a
           read-only prompt, so it is hidden while a character is being made and the width goes to
           the image instead. It comes back for the save stage, below. -->
      <!-- save: this column becomes the form, and the rest of the page steps aside -->
      <div data-when="save" id="cv2-save-host"></div>
    </div>
  </section>

</div>

<script type="module" src="js/character-v2/main.js"></script>
</body>
</html>
