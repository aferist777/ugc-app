<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slider designs — выбери вариант</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:28px; font-family:'Segoe UI',Tahoma,system-ui,sans-serif; background:#eceae3; color:#1c1c1c; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#666; font-size:13px; margin:0 0 22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; }
  .card { background:#fff; border:1px solid #d8d4c8; border-radius:10px; padding:16px 16px 18px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .card h2 { font-size:13px; margin:0 0 2px; }
  .card .note { font-size:11px; color:#8a8579; margin:0 0 14px; }
  .val { font-size:12px; font-weight:bold; color:#b08d57; margin-bottom:8px; }
  .ticklabels { display:flex; justify-content:space-between; font-size:10px; color:#999; margin-top:6px; padding:0 1px; }

  /* base range reset */
  input[type=range].slider { -webkit-appearance:none; appearance:none; width:100%; height:26px; background:transparent; cursor:pointer; margin:0; }
  input[type=range].slider:focus { outline:none; }

  /* ───────── 1 · Flat minimal ───────── */
  .v1 .slider::-webkit-slider-runnable-track { height:5px; border-radius:3px; background:linear-gradient(to right,#b08d57 0 var(--p,0%),#ddd8ca var(--p,0%) 100%); }
  .v1 .slider::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; border:2px solid #b08d57; margin-top:-6px; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .v1 .slider::-moz-range-track { height:5px; border-radius:3px; background:#ddd8ca; }
  .v1 .slider::-moz-range-progress { height:5px; border-radius:3px; background:#b08d57; }
  .v1 .slider::-moz-range-thumb { width:16px; height:16px; border:2px solid #b08d57; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); }

  /* ───────── 2 · Thick rounded ───────── */
  .v2 .slider { height:30px; }
  .v2 .slider::-webkit-slider-runnable-track { height:12px; border-radius:8px; background:linear-gradient(to right,#5b8cff 0 var(--p,0%),#e3e1da var(--p,0%) 100%); }
  .v2 .slider::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:#fff; border:none; margin-top:-6px; box-shadow:0 2px 5px rgba(0,0,0,.25); }
  .v2 .slider::-moz-range-track { height:12px; border-radius:8px; background:#e3e1da; }
  .v2 .slider::-moz-range-progress { height:12px; border-radius:8px; background:#5b8cff; }
  .v2 .slider::-moz-range-thumb { width:24px; height:24px; border:none; border-radius:50%; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.25); }

  /* ───────── 3 · Heat gradient (soft→extreme) ───────── */
  .v3 .slider::-webkit-slider-runnable-track { height:10px; border-radius:6px; background:linear-gradient(to right,#3fae5a,#e8c33b,#e8852f,#d23f3f); }
  .v3 .slider::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid rgba(0,0,0,.15); margin-top:-5px; box-shadow:0 1px 4px rgba(0,0,0,.35); }
  .v3 .slider::-moz-range-track { height:10px; border-radius:6px; background:linear-gradient(to right,#3fae5a,#e8c33b,#e8852f,#d23f3f); }
  .v3 .slider::-moz-range-thumb { width:20px; height:20px; border:2px solid rgba(0,0,0,.15); border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.35); }

  /* ───────── 4 · Stepped with ticks ───────── */
  .v4 .track-wrap { position:relative; }
  .v4 .ticks { position:absolute; left:0; right:0; top:11px; display:flex; justify-content:space-between; padding:0 8px; pointer-events:none; }
  .v4 .ticks i { width:2px; height:8px; background:#c7c1b2; border-radius:1px; }
  .v4 .slider::-webkit-slider-runnable-track { height:6px; border-radius:4px; background:linear-gradient(to right,#b08d57 0 var(--p,0%),#ddd8ca var(--p,0%) 100%); }
  .v4 .slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#b08d57; border:3px solid #fff; margin-top:-6px; box-shadow:0 1px 3px rgba(0,0,0,.3); position:relative; z-index:2; }
  .v4 .slider::-moz-range-track { height:6px; border-radius:4px; background:#ddd8ca; }
  .v4 .slider::-moz-range-progress { height:6px; border-radius:4px; background:#b08d57; }
  .v4 .slider::-moz-range-thumb { width:18px; height:18px; border:3px solid #fff; border-radius:50%; background:#b08d57; box-shadow:0 1px 3px rgba(0,0,0,.3); }

  /* ───────── 5 · Neumorphic ───────── */
  .v5 .track-wrap { background:#e8e5dd; padding:10px 12px; border-radius:12px; box-shadow:inset 2px 2px 5px #c9c6bd, inset -2px -2px 5px #fff; }
  .v5 .slider::-webkit-slider-runnable-track { height:6px; border-radius:4px; background:linear-gradient(to right,#b08d57 0 var(--p,0%),#d6d3ca var(--p,0%) 100%); }
  .v5 .slider::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:#e8e5dd; margin-top:-7px; box-shadow:2px 2px 4px #c9c6bd,-2px -2px 4px #fff; border:1px solid #d6d3ca; }
  .v5 .slider::-moz-range-track { height:6px; border-radius:4px; background:#d6d3ca; }
  .v5 .slider::-moz-range-progress { height:6px; border-radius:4px; background:#b08d57; }
  .v5 .slider::-moz-range-thumb { width:20px; height:20px; border:1px solid #d6d3ca; border-radius:50%; background:#e8e5dd; box-shadow:2px 2px 4px #c9c6bd,-2px -2px 4px #fff; }

  /* ───────── 6 · Pill thumb ───────── */
  .v6 .slider::-webkit-slider-runnable-track { height:8px; border-radius:999px; background:linear-gradient(to right,#7a5bd0 0 var(--p,0%),#e6e1f2 var(--p,0%) 100%); }
  .v6 .slider::-webkit-slider-thumb { -webkit-appearance:none; width:30px; height:18px; border-radius:999px; background:#7a5bd0; border:3px solid #fff; margin-top:-5px; box-shadow:0 1px 4px rgba(122,91,208,.5); }
  .v6 .slider::-moz-range-track { height:8px; border-radius:999px; background:#e6e1f2; }
  .v6 .slider::-moz-range-progress { height:8px; border-radius:999px; background:#7a5bd0; }
  .v6 .slider::-moz-range-thumb { width:30px; height:18px; border:3px solid #fff; border-radius:999px; background:#7a5bd0; box-shadow:0 1px 4px rgba(122,91,208,.5); }

  /* ───────── 7 · Dark glow ───────── */
  .v7 .track-wrap { background:#20242c; padding:12px; border-radius:10px; }
  .v7 .val { color:#7fa8ff; }
  .v7 .ticklabels { color:#7f8696; }
  .v7 .slider::-webkit-slider-runnable-track { height:6px; border-radius:4px; background:linear-gradient(to right,#5b8cff 0 var(--p,0%),#3a4150 var(--p,0%) 100%); }
  .v7 .slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#5b8cff; border:none; margin-top:-6px; box-shadow:0 0 0 4px rgba(91,140,255,.25),0 0 8px rgba(91,140,255,.7); }
  .v7 .slider::-moz-range-track { height:6px; border-radius:4px; background:#3a4150; }
  .v7 .slider::-moz-range-progress { height:6px; border-radius:4px; background:#5b8cff; }
  .v7 .slider::-moz-range-thumb { width:18px; height:18px; border:none; border-radius:50%; background:#5b8cff; box-shadow:0 0 0 4px rgba(91,140,255,.25),0 0 8px rgba(91,140,255,.7); }

  /* ───────── 8 · Retro 98 ───────── */
  .v8 .slider::-webkit-slider-runnable-track { height:4px; border-radius:0; background:#808080; box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 #dfdfdf; }
  .v8 .slider::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:22px; border-radius:0; background:#c0c0c0; margin-top:-9px; border:2px solid; border-color:#fff #808080 #808080 #fff; box-shadow:inset -1px -1px 0 #808080; }
  .v8 .slider::-moz-range-track { height:4px; background:#808080; box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 #dfdfdf; }
  .v8 .slider::-moz-range-thumb { width:14px; height:22px; border-radius:0; background:#c0c0c0; border:2px solid; border-color:#fff #808080 #808080 #fff; }

  /* ───────── 9 · Segmented control (альтернатива слайдеру) ───────── */
  .seg { display:flex; border:1px solid #d8d3c6; border-radius:999px; overflow:hidden; background:#efece4; }
  .seg button { flex:1; border:none; background:transparent; padding:8px 4px; font-size:12px; cursor:pointer; color:#666; transition:background .12s,color .12s; }
  .seg button + button { border-left:1px solid #e0dccf; }
  .seg button.active { background:#b08d57; color:#fff; }
</style>
</head>
<body>
  <h1>Дизайны слайдеров</h1>
  <p class="sub">Под табу-слайдер (4 уровня: Soft · Spicy · Hard · Extreme). Покрути каждый. Скажи номер — применю к ползунку табу в Scen V2.</p>

  <div class="grid" id="grid"></div>

  <p style="margin-top:24px;font-size:12px;color:#777;">Открой: <code>http://localhost:3000/slider-designs.html</code>. Напиши номер варианта.</p>

<script>
  const LABELS = { 1:'Soft', 2:'Spicy', 3:'Hard', 4:'Extreme' };
  const VARIANTS = [
    [1,'Flat minimal','тонкий трек, акцент-заливка'],
    [2,'Thick rounded','толстый округлый трек, крупный бегунок'],
    [3,'Heat gradient','градиент интенсивности soft→extreme'],
    [4,'Stepped + ticks','засечки по 4 уровням'],
    [5,'Neumorphic','мягкие тени, «вдавленный» трек'],
    [6,'Pill thumb','бегунок-таблетка'],
    [7,'Dark glow','тёмный, светящийся бегунок'],
    [8,'Retro 98','под текущую тему приложения'],
  ];

  const grid = document.getElementById('grid');

  VARIANTS.forEach(([n,name,note]) => {
    const card = document.createElement('div');
    card.className = 'card v' + n;
    const ticksHtml = (n === 4) ? '<div class="ticks"><i></i><i></i><i></i><i></i></div>' : '';
    card.innerHTML = `
      <h2>${n} · ${name}</h2>
      <div class="note">${note}</div>
      <div class="val">Spicy</div>
      <div class="track-wrap">
        ${ticksHtml}
        <input type="range" class="slider" min="1" max="4" step="1" value="2">
      </div>
      <div class="ticklabels"><span>Soft</span><span>Spicy</span><span>Hard</span><span>Extreme</span></div>`;
    grid.appendChild(card);
  });

  // Segmented control card (variant 9)
  const segCard = document.createElement('div');
  segCard.className = 'card';
  segCard.innerHTML = `
    <h2>9 · Segmented control</h2>
    <div class="note">альтернатива слайдеру — 4 кнопки</div>
    <div class="val">Spicy</div>
    <div class="seg">
      <button>Soft</button><button class="active">Spicy</button><button>Hard</button><button>Extreme</button>
    </div>`;
  grid.appendChild(segCard);
  segCard.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    segCard.querySelectorAll('.seg button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    segCard.querySelector('.val').textContent = b.textContent;
  }));

  // wire all range sliders: fill % + live label
  function pct(s) { return (s.value - s.min) / (s.max - s.min) * 100; }
  document.querySelectorAll('input[type=range].slider').forEach(s => {
    const card = s.closest('.card');
    const upd = () => { s.style.setProperty('--p', pct(s) + '%'); const lab = card.querySelector('.val'); if (lab) lab.textContent = LABELS[s.value]; };
    s.addEventListener('input', upd);
    upd();
  });
</script>
</body>
</html>
