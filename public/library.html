<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Library</title>
<!-- FIRST: hydrate localStorage from the server before page code runs, so UI state
     (the open shelf, its filter) survives a browser or device change. -->
<script src="/js/storage-sync.js"></script>
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/app-nav.css">
<!-- The media popup, shared with Merge v3 (both drive js/library/viewer.js).
     Before library.css, so anything this page overrides still wins. -->
<link rel="stylesheet" href="css/lib-viewer.css">
<link rel="stylesheet" href="css/references.css">
<!-- The countdown rows of the scenario generator (js/progress.js startInlineProgress). -->
<link rel="stylesheet" href="css/gen-progress.css">
<link rel="stylesheet" href="css/library.css">
<!-- The scenario window "New scenario -> blank" opens - Merge's own (js/scen-window.js, phase V28.2). -->
<link rel="stylesheet" href="css/dialog.css">
<!-- The media tree beside the Media shelf's gallery (js/media-tree.js, phase V28.5). -->
<link rel="stylesheet" href="css/media-tree.css">
<!-- Making a character on the Characters shelf (phase H, js/library/chmake.js). -->
<link rel="stylesheet" href="css/char-make.css">
<!-- The making chats of Environments and Lookbooks (phase I, js/library/makechat.js). -->
<link rel="stylesheet" href="css/makechat.css">
<!-- (phase V34.E) Sound on the shelf: waveforms, the search over SFX, a sound's menu, the cut and online windows (js/sound/). -->
<link rel="stylesheet" href="css/sound.css">
</head>
<body>

<!-- Which entry is lit comes from the address (js/app-nav.js), so this markup does not
     change if the page moves. -->
<nav class="sv3-nav">
  <a href="/merge">Merge</a>
  <a href="/3d">3D Studio</a>
  <a href="/library">Library</a>
  <span class="sp"></span>
</nav>

<div class="lib-body">
  <!-- Shelves. One row per kind; the count fills in when a shelf is read. -->
  <aside class="lib-shelves" id="lib-shelves">
    <button class="lib-shelf" type="button" data-kind="characters">Characters<span class="lib-n"></span></button>
    <button class="lib-shelf" type="button" data-kind="lookbooks">Lookbooks<span class="lib-n"></span></button>
    <button class="lib-shelf" type="button" data-kind="environments">Environments<span class="lib-n"></span></button>
    <!-- Everything a timeline takes - video (B-rolls, Hooks, Uploads), pictures, music and sounds - in a gallery with
         the media tree beside it (phase V28.5; the Music shelf is Audio -> Music here). -->
    <button class="lib-shelf" type="button" data-kind="media">Media<span class="lib-n"></span></button>
    <!-- Every voice we have taken that has our own demo. Rows rather than cards, with a
         permanent info column - see js/library/voices.js. -->
    <button class="lib-shelf" type="button" data-kind="voices">Voices<span class="lib-n"></span></button>
    <!-- Text, not pictures: rows like Voices, and a click opens the scenario right here, where
         its lines are. See js/library/scenarios.js. -->
    <button class="lib-shelf" type="button" data-kind="scenarios">Scenarios<span class="lib-n"></span></button>
    <!-- Finished videos. This shelf has no record store behind it: it IS the finals/
         directory, so a render is on it exactly while its file exists. Merge's export flow
         is the only thing that puts one there or takes it away - see routes/library.js
         _rendersShelf. -->
    <button class="lib-shelf" type="button" data-kind="renders">Renders<span class="lib-n"></span></button>
  </aside>

  <main class="lib-main">
    <div class="lib-bar" id="lib-bar">
      <!-- The shelf's making area in place of the shelf, and the way back - at the LEFT of the bar, one in
           the other's place (the owner, phases G3 and H1). Their words come from the shelf that is open:
           New scenario, New Character, New environment, New lookbook (js/library/main.js MAKERS). -->
      <button class="lib-btn primary" type="button" id="lib-new" hidden></button>
      <button class="lib-btn" type="button" id="lib-back" hidden></button>
      <!-- (phase V28.2) The narrators in place of the list, on Scenarios only - "←" in the place of "New scenario"
           brings back what was there (js/library/narrators.js). -->
      <button class="lib-btn" type="button" id="lib-narr" hidden title="The narrators - how a script is written">Narrators</button>
      <!-- (phase V35) On Media: the path to the node the tree has selected - "AUDIO / SFX / My sounds", every word a press
           away (js/media-tree.js crumbsEl, painted by js/library/main.js). -->
      <div class="lib-crumbs" id="lib-crumbs" hidden></div>
      <!-- (phase V34.E) Over SFX: the search and "find online…" (js/sound/shelf.js, painted by js/library/main.js). -->
      <div class="lib-snd-head" id="lib-snd-head" hidden></div>
      <span class="sp"></span>
      <span class="lib-status" id="lib-status"></span>
      <!-- (phase V27) Stops the link being downloaded - shown only while one is (js/library/links.js). -->
      <button class="lib-btn lib-link-stop" type="button" id="lib-link-stop" hidden title="Stop this download">✕</button>
      <!-- Only appears when two records point at one file; says how many. -->
      <button class="lib-btn" type="button" id="lib-dupes" hidden>Duplicates</button>
      <!-- Only appears when a record points at a file that is not on disk. -->
      <button class="lib-btn" type="button" id="lib-broken" hidden>Broken</button>
      <!-- Only appears when a clip has no thumbnail, or has one that is really a full frame. -->
      <button class="lib-btn" type="button" id="lib-thumbs" hidden>Thumbnails</button>
      <!-- Media only: the one shelf whose contents you bring in rather than generate. -->
      <button class="lib-btn" type="button" id="lib-upload" hidden title="Add video files to the library">Upload</button>
      <!-- (phase V27) The same clips from a link - YouTube, TikTok, Instagram... - downloaded by the server. -->
      <button class="lib-btn" type="button" id="lib-link" hidden>From a link</button>
      <!-- accept follows the node selected in the media tree (js/library/main.js). -->
      <input type="file" id="lib-file" accept="video/*" multiple hidden>
    </div>
    <!-- THE RIGHT COLUMN (phase B): the grid keeps two thirds, and the last third says what the
         selected tile is - on Characters, Lookbooks and Environments (js/library/info.js) - or the
         selected voice, on Voices (js/library/voices.js). Every other shelf has the whole width. -->
    <div class="lib-split" id="lib-split">
      <!-- The gallery's column: the grid, and under it (phase V54) THE MUSIC PLAYER while Music is open - out of the grid
           that is drawn again, and only under it: the tree's column on the right goes down to the bottom (the owner
           2026-10-28: "плеер не должен заходить под столбец дерева"; js/sound/player.js, shown by js/library/main.js). -->
      <div class="lib-field" id="lib-field">
        <div class="lib-grid" id="lib-grid"></div>
        <div id="lib-player" hidden></div>
      </div>
      <!-- (V38.6) Scenarios: the list's width, dragged and remembered (js/library/main.js _wireScSash). -->
      <div class="lib-tree-sash lib-sc-sash" id="lib-sc-sash" hidden title="Drag to resize the list, double-click for the usual width"></div>
      <!-- THE MEDIA TREE (phase V28.5, the owner 2026-10-12): on Media, what it selects is what the grid shows -
           the same tree as Merge's Library panel (js/media-tree.js); the sash sets its width. -->
      <div class="lib-tree-sash" id="lib-tree-sash" hidden title="Drag to resize the tree, double-click for the default width"></div>
      <aside class="lib-tree" id="lib-tree" hidden></aside>
      <aside class="lib-info" id="lib-info" hidden>
        <div class="lib-info-head" id="lib-info-head"></div>
        <div class="lib-info-body" id="lib-info-body"></div>
      </aside>
      <!-- (V38.6) Scenarios: a draft selected in the list - the generator's form, moved here (js/library/make.js mount). -->
      <section class="lib-sc-draft" id="lib-sc-draft" hidden></section>
    </div>
    <!-- THE SCENARIO GENERATOR (phase E): sources down the left, the form or a source's topics on the
         right. Built the first time "New scenario" is pressed and only hidden after that, so what it
         runs goes on while the list is looked at (js/library/make.js). -->
    <div class="lib-make" id="lib-make" hidden></div>
    <!-- THE NARRATORS (phase V28.2): the list, the samples and the voice of the selected one, in place of the scenario
         list or the generator. Built the first time "Narrators" is pressed and only hidden after that, so a sample being
         transcribed or a voice being read goes on (js/library/narrators.js). -->
    <div class="lib-narrators" id="lib-narrators" hidden></div>
    <!-- MAKING A CHARACTER (phase H): the parameters, the portrait with its takes, and the save form that
         draws the 4K sheet. Built the first time "New Character" is pressed and only hidden after that,
         so a portrait or a sheet being made goes on while the shelf is looked at (js/library/chmake.js). -->
    <div class="lib-chmake" id="lib-chmake" hidden></div>
    <!-- THE MAKING CHATS (phase I): New environment and New lookbook - the shelf to build on, the chat,
         and where else a picture comes from. Built the first time they are opened and only hidden after
         that; the work they start goes on on the server (js/library/makechat.js). -->
    <div class="lib-mkchat" id="lib-envmake" hidden></div>
    <div class="lib-mkchat" id="lib-lbmake" hidden></div>
  </main>
</div>

<script type="module" src="js/library/main.js"></script>
</body>
</html>
