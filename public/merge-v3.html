<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Merge v3</title>
<!-- FIRST, before any page code reads localStorage: hydrate it from the server.
     The server is the source of truth for this app, so this has to be a plain
     synchronous script tag at the top of <head> rather than a module. -->
<script src="/js/storage-sync.js"></script>
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/app-nav.css">
<!-- The media popup, shared with the Library page (both drive js/library/viewer.js). -->
<link rel="stylesheet" href="css/lib-viewer.css">
<link rel="stylesheet" href="css/references.css">
<!-- js/progress.js draws the spinner-bar-countdown row and refuses to look like anything
     without this; the music generator in the inspector is what needs it here. -->
<link rel="stylesheet" href="css/gen-progress.css">
<link rel="stylesheet" href="css/merge-v3.css">
<!-- The dialog frame and its buttons, shared with the Library (phase V28.2) - RIGHT AFTER merge-v3.css, where
     they were: the cascade stays as it was. -->
<link rel="stylesheet" href="css/dialog.css">
<!-- The media tree beside the Library panel's gallery (js/media-tree.js, phase V28.4). -->
<link rel="stylesheet" href="css/media-tree.css">
<!-- The pictures chat in the Library panel (js/merge-v3/picchat.js, phase J). -->
<link rel="stylesheet" href="css/mv3-imagen.css">
<link rel="stylesheet" href="css/mv3-catalog.css">
<!-- (phase V55) New environment / New lookbook in the Library panel - the Library's making chats (js/library/makechat.js). -->
<link rel="stylesheet" href="css/makechat.css">
<!-- The fonts captions are drawn in - the same files the render uses (phase K5). -->
<link rel="stylesheet" href="css/caption-fonts.css">
<!-- The caption presets beside the settings of the picked captions (js/merge-v3/captions-view.js, phase K6). -->
<link rel="stylesheet" href="css/mv3-captions.css">
<!-- (phase V33.1) A highlights project: its view, its popup, the caption style picked in it. -->
<link rel="stylesheet" href="css/mv3-highlights.css">
<!-- (phase V34.E) Sound on the shelf: waveforms, the search over SFX, a sound's menu, the cut and online windows (js/sound/). -->
<link rel="stylesheet" href="css/sound.css">
<!-- (phase V34.E) The "generate audio" view (js/merge-v3/audchat.js). -->
<link rel="stylesheet" href="css/mv3-audio.css">
<!-- (phase V36) The timeline's transport, a sound's waveform on its clip, the stretch cut out of every lane. -->
<link rel="stylesheet" href="css/mv3-timeline.css">
</head>
<body>

<!-- Which entry is lit is read from the address by js/app-nav.js, so this markup
     does not change when the page moves from /merge-v3 to /merge. -->
<nav class="sv3-nav">
  <a href="/merge">Merge</a>
  <a href="/3d">3D Studio</a>
  <a href="/library">Library</a>
  <span class="sp"></span>
  <!-- The render queue, up here beside Alerts (the owner, 2026-09-22): both are readings about
       work in flight, and neither belongs to the project the bar below is about. It opens the
       same window it always did (js/merge-v3/queue.js). The bell and Admin are put in after it
       by js/app-nav.js, so the right-hand end reads Queue, the wait, Alerts, Admin. -->
  <button class="sv3-navbtn" id="mv3-queue" type="button"
          title="Render queue - projects waiting to be rendered">Queue</button>
</nav>

<main class="mv3-app">

  <!-- The project bar. Back because a project selector belongs to the whole page and has
       nowhere honest to live inside one panel. Newest project first - filled by
       js/merge-v3/projects.js. -->
  <div class="mv3-bar">
    <!-- Left of the picker on purpose: making one and choosing one are the same decision, and
         the new project is what the picker will be showing a second later. -->
    <button class="mv3-c-btn" id="mv3-project-new" type="button"
            title="Start an empty project and open it">+ new project</button>
    <label class="mv3-bar-fld">
      <span>Project</span>
      <select id="mv3-project"></select>
      <!-- The same slot as the picker, one of them shown at a time: renaming happens where the
           name already is, so there is nothing to look for and nothing that moves. -->
      <input id="mv3-project-name" type="text" maxlength="120" hidden
             autocomplete="off" spellcheck="false">
    </label>
    <!-- Between the picker and the delete: it acts on the project the picker is showing, and
         reads as the milder of the two things that can be done to it. -->
    <button class="mv3-c-btn" id="mv3-project-edit" type="button"
            title="Rename this project">edit</button>
    <!-- Two clicks, not a dialog: the first turns the button into "really?", the second
         does it. A modal for this is heavier than the action deserves, and the button
         showing its own armed state is impossible to miss. -->
    <button class="mv3-c-btn danger" id="mv3-project-del" type="button"
            title="Delete this project's timeline">delete</button>
    <span class="mv3-bar-note" id="mv3-project-note"></span>
    <span class="sp"></span>
    <!-- (phase V33.4) In a highlights project only: every fragment ticked, or none - for the render beside it
         (js/merge-v3/highlights.js). -->
    <button class="mv3-c-btn" id="mv3-hl-all" type="button" hidden>select all</button>
    <!-- The render window, with the export settings: js/merge-v3/export-b.js. (The queue button
         that stood here moved into the top strip, beside Alerts - phase R.) In a highlights project it renders the
         ticked fragments, and stops them while they render (phase V33.4). -->
      <button class="mv3-c-btn mv3-x-open" id="mv3-export" type="button"
            title="Render this timeline with FFmpeg">Export</button>
  </div>

  <div class="mv3-work">

    <!-- The left column is a stack: the switchable pair on top, the timeline under it, the
         horizontal sash between them. The preview takes the whole height on the right, so a
         9:16 stage is finally as tall as the window lets it be. -->
    <div class="mv3-left" id="mv3-left">

      <!-- Two panels, exactly one open. Markup order does not decide what is on the
           left - flex `order` does (css/merge-v3.css), so the collapsed spine stays
           at the left edge whichever of the two is collapsed. The spine is the switch,
           and it is yellow, the way the Character page marks the same kind of button. -->
      <div class="mv3-pair" id="mv3-pair">

      <section class="mv3-panel mv3-col" id="mv3-library" data-col="library">
        <div class="mv3-spine">Library</div>
        <div class="mv3-panel-head">
          <!-- THE VIEWS ARE CRUMBS (phase V18.2, the owner 2026-10-08): "Library / generate image / generate video /
               captions", always there, the one showing lit, any other one press away - the generate menu of the
               timeline went. "Library" is the shelf; the chats are js/merge-v3/picchat.js and vidchat.js; "captions"
               picks the subtitle lane (js/merge-v3/lib-views.js). In a narrow panel the chats read "image" / "video".
               "scenarios /" left of "Library" (phase V28.3, the owner 2026-10-12): the scenarios a talking head is made
               from, in the draft and a blank project only (js/merge-v3/scen-pick.js). -->
          <button class="mv3-lib-crumb" id="mv3-lib-scen" type="button" hidden>scenarios /</button>
          <!-- (phase V33.1) A highlights project's own view - its tiles and the card of a moment (js/merge-v3/highlights.js);
               in such a project the crumbs are "highlights / Library / generate image / generate video / generate audio"
               (phase V49, the owner's (пр4); css/mv3-highlights.css) - the chats talk in ONE conversation per project. -->
          <button class="mv3-lib-crumb" id="mv3-lib-hl" type="button" hidden>highlights /</button>
          <span class="mv3-panel-title" id="mv3-lib-title">Library</span>
          <button class="mv3-lib-crumb" id="mv3-lib-gen" type="button">/ <span class="lg">generate </span>image</button>
          <button class="mv3-lib-crumb" id="mv3-lib-vgen" type="button">/ <span class="lg">generate </span>video</button>
          <!-- The video chat's catalog, right beside its crumb (phase V6, the owner 2026-10-06) - shown while it is. -->
          <span class="mv3-pc-head" id="mv3-vc-headl" hidden></span>
          <!-- (phase V34.E) Music and sounds for the open project - Suno and ElevenLabs (js/merge-v3/audchat.js). -->
          <button class="mv3-lib-crumb" id="mv3-lib-agen" type="button" hidden>/ <span class="lg">generate </span>audio</button>
          <button class="mv3-lib-crumb" id="mv3-lib-cap" type="button">/ captions</button>
          <span class="sp"></span>
          <!-- The chat's own buttons, while it shows. -->
          <span class="mv3-pc-head" id="mv3-pc-head" hidden></span>
          <span class="mv3-pc-head" id="mv3-vc-head" hidden></span>
        </div>
        <!-- Upload progress and refusals. Its own element, outside the body: the body
             is emptied and rebuilt on every load, which would wipe the message. -->
        <div class="mv3-libstatus" id="mv3-lib-status" hidden></div>
        <!-- THE GALLERY AND THE MEDIA TREE (phase V28.4, the owner 2026-10-12): what the tree has selected is what the
             gallery shows (js/merge-v3/library.js, js/media-tree.js); the sash between them sets the tree's width. -->
        <div class="mv3-lib-row" id="mv3-lib-row">
          <div class="mv3-panel-body"></div>
          <div class="mv3-lib-sash" id="mv3-lib-sash" title="Drag to resize the tree, double-click for the default width"></div>
          <div class="mv3-lib-tree" id="mv3-lib-tree"></div>
        </div>
        <!-- The pictures chat, built the first time it is shown (js/merge-v3/picchat.js). -->
        <div class="mv3-pc" id="mv3-pc"></div>
        <div class="mv3-pc is-video" id="mv3-vc"></div>
        <!-- (phase V34.E) "generate audio": the settings, the constructor, "Made here" (js/merge-v3/audchat.js). -->
        <div class="mv3-pc is-audio" id="mv3-ac"></div>
        <!-- (phase V55, the owner's (гн11)) New environment / New lookbook - the Library's own chats (js/library/makechat.js),
             opened by the "+" of IMAGES -> Environments / Lookbooks as a view of this panel (js/merge-v3/library.js). -->
        <div class="lib-mkchat mv3-mkchat" id="lib-envmake" hidden></div>
        <div class="lib-mkchat mv3-mkchat" id="lib-lbmake" hidden></div>
        <!-- The scenarios view: a talking head starts here (js/merge-v3/scen-pick.js). -->
        <div class="mv3-scv" id="mv3-sc"></div>
        <!-- A highlights project's tiles and the card of a moment (phase V33.1, js/merge-v3/highlights.js). -->
        <div class="mv3-hlv" id="mv3-hl"></div>
        <!-- The caption presets, left of the settings strip while captions are picked (js/merge-v3/captions-view.js). -->
        <div class="mv3-cap" id="mv3-cap"></div>
        <!-- Fed by the "+" tile and by a drop onto the grid. accept is a hint only (set for the node selected),
             so the drop path checks the files itself. -->
        <input type="file" id="mv3-lib-file" accept="video/*" multiple hidden>
        <!-- WHAT IS PICKED ON THE TIMELINE - a clip, a lane, several clips - slides in over the
             Library from the right (phase L5, the owner 2026-09-23), and slides out when nothing is.
             Painted by js/merge-v3/inspector.js. -->
        <aside class="mv3-over" id="mv3-over" aria-label="Settings of what is picked on the timeline">
          <div class="mv3-over-body"></div>
        </aside>
      </section>

      <!-- SETUP (phase L, the owner 2026-09-23). What this panel holds now is the build of a
           talking head and the scenario picker that starts one; the settings of whatever is picked
           on the timeline slide over the Library instead. Its id stays: four modules find it. -->
      <section class="mv3-panel mv3-col" id="mv3-inspector" data-col="inspector">
        <div class="mv3-spine">Setup</div>
        <div class="mv3-panel-head">
          <span class="mv3-panel-title">Setup</span>
          <span class="sp"></span>
        </div>
        <!-- Filled by js/merge-v3/inspector.js: the picker, or the build (js/merge-v3/workshop.js). -->
        <div class="mv3-panel-body"></div>
        <!-- The frames chat of a talking head (phase V26.5), laid over the place the fields leave for it - outside the
             body, which every paint empties (js/merge-v3/fchat.js). -->
        <div class="mv3-pc is-frames" id="mv3-fc"></div>
      </section>

      </div>

      <div class="mv3-sash is-h" id="mv3-sash-h" title="Drag to resize · double-click to reset"></div>

      <section class="mv3-panel" id="mv3-timeline">
        <div class="mv3-panel-head">
          <span class="mv3-panel-title">Timeline</span>
          <!-- Undo / redo as buttons rather than a shortcut: applying an effect from a
               track stamps it onto every clip in it, and the report on the old editor is
               that its Ctrl+Z never actually worked. A visible control also shows whether
               there is anything to undo. Disabled until the timeline store is bound. -->
          <button class="mv3-iconbtn" id="mv3-undo" type="button" title="Undo" disabled>&#8630;</button>
          <button class="mv3-iconbtn" id="mv3-redo" type="button" title="Redo" disabled>&#8631;</button>
          <button class="mv3-iconbtn is-text" id="mv3-split" type="button"
                  title="Cut the selected clip at the playhead">split</button>
          <!-- The transport, right of split (phase V36, T3; the owner 2026-10-23) - it moves the playhead the lanes below
               show. Driven by js/merge-v3/preview-b.js (_wireTransport) by these ids; Space plays as before. -->
          <span class="mv3-tl-transport">
            <button class="mv3-iconbtn" id="mv3-pv-start" type="button" title="Back to the start">&#9198;&#xFE0E;</button>
            <button class="mv3-iconbtn" id="mv3-pv-back" type="button" title="Back 5 seconds">&#9194;&#xFE0E;</button>
            <button class="mv3-iconbtn is-play" id="mv3-pv-play" type="button" title="Play (Space)">&#9654;</button>
            <button class="mv3-iconbtn" id="mv3-pv-fwd" type="button" title="Forward 5 seconds">&#9193;&#xFE0E;</button>
            <!-- (phase V44) Cut silence: the pauses of main audio in the stretch or the picked clips shortened
                 (js/merge-v3/tl-silence.js) - live while something is picked, dim otherwise. -->
            <button class="mv3-iconbtn is-silence is-dim" id="mv3-silence" type="button" title="Cut silence (S)"><svg viewBox="0 0 18 14" width="16" height="13" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="2.6" cy="3.2" r="1.7"/><circle cx="2.6" cy="10.8" r="1.7"/><path d="M4 4.2 9.2 9.4M4 9.8 9.2 4.6"/><path d="M10.4 7c.9-2.6 1.5-2.6 2.2 0s1.3 2.6 2.2 0 1.4-2.6 2.2 0"/></g></svg></button>
          </span>
          <span class="sp"></span>
          <!-- Only ever shown when a save was refused or failed. Silence about a lost edit
               is what made the old store's data loss so hard to notice. -->
          <span class="mv3-tl-status" id="mv3-tl-status" hidden></span>
          <span class="mv3-tl-clock" id="mv3-tl-clock">0:00.0</span>
          <button class="mv3-iconbtn is-text" id="mv3-fit" type="button"
                  title="Fit the whole timeline into view">FIT</button>
          <!-- px/sec, the same scale and range the old editor used. Alt + wheel over the timeline moves it too, toward the
               playhead (phase V49.1, js/merge-v3/timeline-b.js _onWheel). -->
          <label class="mv3-tl-zoom" title="Timeline zoom (px/sec) - or Alt + wheel over the timeline, toward the playhead">
            <span>zoom</span>
            <input type="range" id="mv3-zoom" min="1" max="240" step="1" value="60">
            <span class="mv3-tl-pps" id="mv3-tl-pps">60</span>
          </label>
        </div>
        <!-- (phase V28.4) Media of this project deleted from the library: said here, the clips red (timeline-b.js). -->
        <div class="mv3-tl-gone" id="mv3-tl-gone" hidden></div>
        <!-- Ruler, lanes and playhead are built by js/merge-v3/timeline-b.js from the project's
             list of lanes. Not .mv3-panel-body - this one scrolls itself and takes no padding. -->
        <div class="mv3-tl" id="mv3-tl"></div>
      </section>

    </div>

    <div class="mv3-sash is-v" id="mv3-sash-v" title="Drag to resize · double-click to reset"></div>

    <section class="mv3-panel" id="mv3-preview">
      <div class="mv3-panel-head">
        <span class="mv3-panel-title">Preview</span>
        <span class="sp"></span>
      </div>
      <!-- Its own body class: this one centres the stage instead of scrolling a list.
           js/merge-v3/preview-b.js puts the canvas inside the stage. -->
      <div class="mv3-preview-body">
        <div class="mv3-stage" id="mv3-stage"></div>
      </div>
      <!-- The time at the bottom left, and the backing resolution to the right of it (the transport went to the timeline's
           header, right of split - phase V36, T3). Quality changes only how many pixels the canvas composites into - it
           never touches the project or the eventual export. -->
      <div class="mv3-pv-bar">
        <span class="mv3-pv-time" id="mv3-pv-time">0:00.0 / 0:00.0</span>
        <label class="mv3-pv-q" title="Preview resolution - not the export">
          <span>q</span>
          <select id="mv3-pv-q"></select>
        </label>
        <!-- The same stage, shown big. Not a second canvas - see js/merge-v3/bar.js. -->
        <button class="mv3-pv-btn" id="mv3-pv-big" type="button" title="Enlarge the preview">&#9974;</button>
        <!-- Saves the frame under the playhead into the library at the film's own size, drawn off
             the original files (js/merge-v3/preview-b.js grabFrame). -->
        <button class="mv3-pv-btn" id="mv3-pv-shot" type="button"
                title="Save this frame to the library (Images / Screenshots)">&#128247;</button>
        <span class="sp"></span>
      </div>
    </section>

  </div>


</main>

<script type="module" src="/js/merge-v3/main.js"></script>
</body>
</html>
