<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Merge v2</title>
<!-- FIRST, like every other page: hydrate localStorage from the server before page code
     reads it. -->
<script src="/js/storage-sync.js"></script>
<!-- midnight.css carries both the design tokens and the ~350 rules that style this editor,
     so it is linked rather than copied. When merge.html finally goes, the legacy half of
     that file can be trimmed; until then there is one definition of the editor's look. -->
<link rel="stylesheet" href="css/midnight.css">
<link rel="stylesheet" href="css/app-nav.css">
<style>
  /* The page IS the editor. merge.html wrapped it in .main-window > .window > .window-body >
     .app-grid > .app-main > #l1-skleyka > #combo-sub-mergev2 - six nested boxes, a tab
     system and a 98.css window frame. Here the wrapper exists only because the editor's own
     CSS hangs off #combo-sub-mergev2. */
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; overflow: hidden;
         background: var(--bg); color: var(--ink); font: 13px/1.5 var(--font); }
  #l1-skleyka, #combo-sub-mergev2 { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  /* The progress rows the editor writes into. */
  #activity-log { position: fixed; right: 10px; bottom: 10px; z-index: 9000;
                  display: flex; flex-direction: column; gap: 4px; max-width: 320px; }
  #activity-log:empty { display: none; }
</style>
</head>
<body>

<nav class="sv3-nav" id="l1-tabs">
  <a href="/character">Character</a>
  <a href="/scenarios">Scenarios</a>
  <a href="/merge-v2" class="cur">Merge</a>
  <a href="/birols">Birols</a>
  <span class="sp"></span>
  <a href="/library">Library</a>
  <span id="balance-bar" class="sv3-bal" title="API balance">…</span>
</nav>

<!-- Both ids are load-bearing, not decoration: 289 rules in midnight.css that style this
     editor dark are scoped "#l1-skleyka #mv2-...", and the editor's own layout CSS hangs off
     #combo-sub-mergev2. Without the outer id the page comes up in the Windows-98 palette the
     editor injects for itself. -->
<div id="l1-skleyka">
<div id="combo-sub-mergev2">
  <div id="mv2-root">
    <div id="mv2-topbar">
      <!-- The Creatives|VSL mode switch and the legacy VSL video controls are gone
           (Ph13.2): VSL is being retired, so the editor has one mode. -->
      <label for="mv2-session" style="font-size:11px;">Project:</label>
      <select id="mv2-session" style="font-size:11px;max-width:300px;"></select>
      <button id="mv2-vsl-del" title="Delete this VSL project and all its data (the source video stays in the library)" style="display:none;">🗑</button>
      <button id="mv2-copy" title="Copy insert layout from another project" disabled>⧉ Copy from</button>
      <button id="mv2-save" title="Save project snapshot" disabled>💾 Save</button>
      <button id="mv2-close" title="Close project (keeps data, can reopen)" disabled>✕ Close</button>
      <span class="mv2-spacer"></span>
      <span id="mv2-status" style="font-size:10px;color:#333;"></span>
      <button id="mv2-delete" title="Delete project — wipes all its renders and closes it in Merge (double-click). Edit session is kept." disabled>🗑 Delete</button>
      <button id="mv2-export" disabled>Export</button>
    </div>
    <div id="mv2-preview">
      <div id="mv2-media">
        <div id="mv2-media-tabs">
          <button id="mv2-media-birols" class="mv2-media-tab active" data-media="birol">Birols</button>
          <button id="mv2-media-hooks" class="mv2-media-tab" data-media="hook">Hooks</button>

          <span class="mv2-spacer"></span>
          <span id="mv2-media-hint" style="font-size:10px;color:#444;">Click to insert · drag onto timeline</span>
        </div>
        <div id="mv2-media-bar"></div>
        <div id="mv2-media-grid"></div>
      </div>
      <div class="mv2-col-resizer" data-resize="insp" title="Drag to resize columns"></div>
      <aside id="mv2-inspector">
        <div id="mv2-inspector-body" style="font-size:10px;color:#444;">Select a clip to edit.</div>
      </aside>
      <div class="mv2-col-resizer" data-resize="canvas" title="Drag to resize columns"></div>
      <div id="mv2-canvas-wrap">
        <canvas id="mv2-canvas" width="270" height="480"></canvas>
      </div>
    </div>
    <div id="mv2-transport">
      <button id="mv2-range-toggle" title="Render only a range (drag the edges of the bar over the ruler). Defaults to the first 2 minutes.">Range</button>
      <span id="mv2-time" style="font-size:10px;color:#333;">0.00 / 0.00s</span>
      <input id="mv2-zoom" type="range" min="1" max="240" step="1" value="60" title="Timeline zoom (px/sec)" style="width:120px;">
      <button id="mv2-follow-toggle" title="Follow playhead: keep it centered while playing">&#9678; Follow</button>
      <button id="mv2-split-btn" title="Split the fragment under the playhead into two (Ctrl+F)">&#9986; Split</button>
      <span class="mv2-spacer"></span>
      <span id="mv2-legend" style="font-size:10px;color:#444;">Preview is an approximation — FFmpeg export is authoritative.</span>
    </div>
    <div id="mv2-tracks-wrap">
      <div id="mv2-range" title="Render range — drag the edges to export only a span; double-click to reset"></div>
      <div id="mv2-ruler"></div>
      <div id="mv2-tracks"></div>
    </div>
    <div id="mv2-bottom-spacer"></div>
  </div>
</div>
</div>

<!-- setStatus() writes here; kept hidden, as merge.html does. -->
<span id="status-bar" style="display:none;"></span>
<div id="activity-log"></div>

<!-- ── Scripts ──────────────────────────────────────────────────────────────────
     Ten files instead of the old page's forty-four. What is NOT here is the point:
     scen-edit-panel (218KB), scen-timeline (120KB), scen-montage (72KB), scen-list (56KB)
     and the rest of the old Scenarios block - about 530KB - because the editor's only two
     calls into it are optional-chained (window.refreshTimelineBirolys?.() and
     renderAllTimelines?.()) and simply no-op without it.

     scen-state.js and scen-birolys.js are still here for three names: saveEditState,
     editFrozenSessions and ADV_DEFAULTS. 44KB between them, and lifting them out is
     cleanup rather than a prerequisite. -->
<script src="js/utils.js"></script>
<script src="js/biroly-archive.js"></script>
<script src="js/log-panel.js"></script>
<script src="js/edit-sync.js"></script>
<script src="js/scen-state.js"></script>
<script src="js/scen-birolys.js"></script>
<script src="js/hooks-store.js"></script>
<script src="js/timeline-store.js"></script>
<script src="js/mergev2-render.js"></script>
<script src="js/mergev2-adapter.js"></script>
<script src="js/mergev2-compositor.js"></script>
<script src="js/mergev2-timeline.js"></script>
<script src="js/mergev2-tab.js"></script>
<!-- The stores are server-backed; these are the layers that keep them so. -->
<script src="js/server-sync-guard.js"></script>
<script src="js/biroly-server-sync.js"></script>
<script src="js/hooks-server-sync.js"></script>

<script>
/* Boot. The old page did this inside scen-init.js, mixed in with loading scenarios,
   details, obrazy and resuming the Edit panel - none of which this page has. What is
   left is the part that matters: the server decides what the editor opens with.

   loadEditState() is scen-state's, and its tail reaches for getSkleykaClosed() and
   getCompletedSessions() from files this page does not load. Its whole body sits in one
   try/catch, and the sessions are assigned before that tail runs - so it populates what
   we need and swallows the rest. That is luck rather than design, and it is exactly what
   the later extraction should fix. */
(async function () {
  if (window.EditSync && EditSync.hydrate) { try { await EditSync.hydrate(); } catch (e) {} }
  try { loadEditState(); } catch (e) { console.warn('[merge-v2] loadEditState:', e.message); }
  try { if (window.MV2Tab && MV2Tab.activate) MV2Tab.activate(); }
  catch (e) { console.error('[merge-v2] the editor did not start:', e); }
  if (window.EditSync && EditSync.startPolling) EditSync.startPolling();
  try { if (typeof refreshBalance === 'function') refreshBalance(); } catch (e) {}
})();
</script>
</body>
</html>
