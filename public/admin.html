<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Admin</title>
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/app-nav.css">
<!-- For .lib-btn, the one button style every page shares. -->
<link rel="stylesheet" href="css/lib-viewer.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<nav class="sv3-nav">
  <a href="/merge">Merge</a>
  <a href="/library">Library</a>
  <span class="sp"></span>
  <a href="/admin">Admin</a>
</nav>

<div class="adm-body">
  <!-- Three panes, one strip. The address carries the pane (#keys, #data, #local), so a reload stays put. -->
  <div class="adm-tabs" role="tablist">
    <button class="adm-tab cur" type="button" role="tab" data-pane="keys">API keys</button>
    <button class="adm-tab" type="button" role="tab" data-pane="data">Import / Export</button>
    <button class="adm-tab" type="button" role="tab" data-pane="local">This computer</button>
    <button class="adm-tab" type="button" role="tab" data-pane="thanks">Thanks</button>
  </div>

  <!-- The keys every generator reads, saved into settings.json in the library. -->
  <section class="adm-panel" data-pane="keys">
    <div class="adm-head">
      <span class="adm-title">API keys</span>
      <span class="adm-count">first six and last four are all anyone sees here</span>
      <span class="adm-count" id="adm-keys-health"></span>
      <span class="sp"></span>
      <button class="lib-btn" type="button" id="adm-keys-check" title="Ask each provider whether its key works">Check again</button>
      <button class="lib-btn adm-go" type="button" id="adm-keys-save">💾 Save</button>
    </div>
    <div class="adm-keys" id="adm-keys"></div>
    <div class="adm-status" id="adm-keys-status"></div>
  </section>

  <!-- Taking the library out as .zip volumes, and bringing volumes in (js/data-io.js). -->
  <section class="adm-panel" data-pane="data" hidden>
    <div class="adm-head">
      <span class="adm-title">Import / Export</span>
      <span class="adm-count">everything in this library, as .zip volumes - out, or back in</span>
    </div>
    <div class="dio-body">
      <div class="dio-sec">Take out</div>
      <div id="dio-groups"></div>
      <div class="dio-warn" id="dio-warn" hidden></div>
      <div class="dio-total" id="dio-total">measuring…</div>
      <div class="dio-actions">
        <button class="lib-btn dio-go" type="button" id="dio-export">Build the archive</button>
      </div>
      <div class="dio-status" id="dio-status"></div>
      <div class="dio-parts" id="dio-parts"></div>

      <div class="dio-sec">Bring in</div>
      <label class="dio-row">
        <input type="checkbox" id="dio-overwrite">
        <span class="dio-lbl"><b>Overwrite what is already here</b>
          <i>Off, an import only ADDS: nothing already in this library is touched, and a
             record that exists keeps its local version. On, an archive taken later
             replaces what it collides with.</i></span>
      </label>
      <div class="dio-actions">
        <button class="lib-btn" type="button" id="dio-import">Choose .zip volumes…</button>
        <input type="file" id="dio-file" accept=".zip" multiple hidden>
      </div>
      <div class="dio-status" id="dio-imp-status"></div>
      <div class="dio-prog" id="dio-imp-prog" hidden>
        <div class="dio-bar"><i id="dio-bar-all"></i></div>
        <div class="dio-now" id="dio-now"></div>
        <div class="dio-bar dio-bar-sm"><i id="dio-bar-one"></i></div>
      </div>
      <div class="dio-parts" id="dio-imp-log"></div>
    </div>
  </section>

  <!-- Speech recognition on this computer: the program, the model, the NVIDIA build (js/admin-local.js, K1b). -->
  <section class="adm-panel" data-pane="local" hidden>
    <div class="adm-head">
      <span class="adm-title">This computer</span>
      <span class="adm-count">speech recognition for captions - when Groq cannot be asked, or a subtitle lane listens here</span>
    </div>
    <div class="dio-body" id="loc-body"></div>
  </section>

  <!-- The open-source work the app is built on: every repository, its licence, and what it does here (js/admin-thanks.js). -->
  <section class="adm-panel" data-pane="thanks" hidden>
    <div class="adm-head">
      <span class="adm-title">Thanks</span>
      <span class="adm-count" id="thx-count"></span>
    </div>
    <div class="dio-body thx-body" id="thx-body"></div>
  </section>
</div>

<!-- app-nav is a module: it lights the entry that matches the address. -->
<script type="module">import { initNav } from './js/app-nav.js'; initNav();</script>
<script src="js/admin-keys.js"></script>
<script src="js/data-io.js"></script>
<script src="js/admin-local.js"></script>
<script src="js/admin-thanks.js"></script>
<script>
  // The tab strip, after the panes' own scripts so they hear the first `adm-pane`. Panes are
  // hidden rather than rebuilt, so a half-typed key or an export being built survives a switch.
  (function () {
    var tabs = document.querySelectorAll('.adm-tab');
    function show(name, fromClick) {
      var known = [].some.call(tabs, function (t) { return t.getAttribute('data-pane') === name; });
      if (!known) name = 'keys';
      tabs.forEach(function (t) { t.classList.toggle('cur', t.getAttribute('data-pane') === name); });
      document.querySelectorAll('.adm-panel[data-pane]').forEach(function (p) {
        p.hidden = p.getAttribute('data-pane') !== name;
      });
      // The page's own path: <base href="/"> would make a bare '#keys' the address of Merge, and F5 would open it.
      if (fromClick) history.replaceState(null, '', location.pathname + '#' + name);
      document.dispatchEvent(new CustomEvent('adm-pane', { detail: name }));
    }
    tabs.forEach(function (t) {
      t.addEventListener('click', function () { show(t.getAttribute('data-pane'), true); });
    });
    show(location.hash.slice(1));
  })();
</script>
</body>
</html>
