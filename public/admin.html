<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Admin</title>
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/app-nav.css">
<!-- For .lib-btn, the one button style every page shares. -->
<link rel="stylesheet" href="css/lib-viewer.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<nav class="sv3-nav">
  <a href="/character">Character</a>
  <a href="/scenarios">Scenarios</a>
  <a href="/merge">Merge</a>
  <a href="/birols">Birols</a>
  <span class="sp"></span>
  <a href="/library" data-also="/library2">Library</a>
  <a href="/admin">Admin</a>
  <!-- The kie.ai balance. This is the one page that carries it: it is a number to act on here,
       and on every other page it was a reading nobody could act on. -->
  <span class="sv3-bal" id="sv3-balance" title="kie.ai balance">…</span>
</nav>

<div class="adm-body">
  <!-- The settings: the keys every generator reads, saved into settings.json in the library. -->
  <section class="adm-panel">
    <div class="adm-head">
      <span class="adm-title">API keys</span>
      <span class="adm-count">first six and last four are all anyone sees here</span>
      <span class="adm-count" id="adm-keys-health"></span>
      <span class="sp"></span>
      <button class="lib-btn" type="button" id="adm-keys-check" title="Ask each provider whether its key works">Check again</button>
      <button class="lib-btn adm-go" type="button" id="adm-keys-save">💾 Save</button>
    </div>
    <div class="adm-keys" id="adm-keys"></div>
    <div class="adm-status" id="adm-keys-status"></div>
  </section>
</div>

<!-- app-nav is a module: it lights the entry that matches the address. -->
<script type="module">import { initNav } from './js/app-nav.js'; initNav();</script>
<script src="js/admin-keys.js"></script>
</body>
</html>
