<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Admin</title>
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/app-nav.css">
<!-- For .lib-btn, the one button style every page shares. -->
<link rel="stylesheet" href="css/lib-viewer.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<nav class="sv3-nav">
  <a href="/merge">Merge</a>
  <a href="/3d">3D Studio</a>
  <a href="/library">Library</a>
  <span class="sp"></span>
  <a href="/admin">Admin</a>
</nav>

<div class="adm-body">
  <!-- Four panes, one strip. The address carries the pane (#keys, #ai, #local, #thanks), so a reload stays put. (Import /
       Export went in phase V54, the owner 2026-10-28.) -->
  <div class="adm-tabs u-tabs" role="tablist">
    <button class="adm-tab u-tab cur" type="button" role="tab" data-pane="keys">API keys</button>
    <button class="adm-tab u-tab" type="button" role="tab" data-pane="ai">AI settings</button>
    <button class="adm-tab u-tab" type="button" role="tab" data-pane="local">This computer</button>
    <button class="adm-tab u-tab" type="button" role="tab" data-pane="thanks">Thanks</button>
  </div>

  <!-- The keys every generator reads, saved into settings.json in the library. -->
  <section class="adm-panel" data-pane="keys">
    <div class="adm-head">
      <span class="adm-title">API keys</span>
      <span class="adm-count">first six and last four are all anyone sees here</span>
      <span class="adm-count" id="adm-keys-health"></span>
      <span class="sp"></span>
      <button class="u-btn is-s" type="button" id="adm-keys-check" title="Ask each provider whether its key works">Check again</button>
      <button class="u-btn is-s is-main adm-go" type="button" id="adm-keys-save">💾 Save</button>
    </div>
    <div class="adm-keys" id="adm-keys"></div>
    <div class="adm-status" id="adm-keys-status"></div>
  </section>

  <!-- The agents' ladder: who reads the words and the pictures, and who if the first is silent (js/admin-ai.js, V25). -->
  <section class="adm-panel" data-pane="ai" hidden>
    <div class="adm-head">
      <!-- (V38.1) Back to where the way here started - the scenario generator, on its draft; only when it started there. -->
      <button class="u-btn is-s adm-back" type="button" id="ai-back" hidden>← back</button>
      <span class="adm-title">AI settings</span>
      <span class="adm-count">the models that read your words and pictures and answer</span>
    </div>
    <div class="dio-body" id="ai-body"></div>
  </section>

  <!-- Speech recognition on this computer: the program, the model, the NVIDIA build (js/admin-local.js, K1b). -->
  <section class="adm-panel" data-pane="local" hidden>
    <div class="adm-head">
      <span class="adm-title">This computer</span>
      <span class="adm-count">speech recognition for captions, and the yt-dlp links are read with</span>
    </div>
    <div class="dio-body" id="loc-body"></div>
  </section>

  <!-- The open-source work the app is built on: every repository, its licence, and what it does here (js/admin-thanks.js). -->
  <section class="adm-panel" data-pane="thanks" hidden>
    <div class="adm-head">
      <span class="adm-title">Thanks</span>
      <span class="adm-count" id="thx-count"></span>
    </div>
    <div class="dio-body thx-body" id="thx-body"></div>
  </section>
</div>

<!-- app-nav is a module: it lights the entry that matches the address. -->
<script type="module">import { initNav } from './js/app-nav.js'; initNav();</script>
<script src="js/admin-keys.js"></script>
<script src="js/admin-ai.js"></script>
<script src="js/admin-local.js"></script>
<script src="js/admin-thanks.js"></script>
<script>
  // The tab strip, after the panes' own scripts so they hear the first `adm-pane`. Panes are
  // hidden rather than rebuilt, so a half-typed key survives a switch.
  (function () {
    var tabs = document.querySelectorAll('.adm-tab');
    function show(name, fromClick) {
      var known = [].some.call(tabs, function (t) { return t.getAttribute('data-pane') === name; });
      if (!known) name = 'keys';
      tabs.forEach(function (t) { t.classList.toggle('cur', t.getAttribute('data-pane') === name); });
      document.querySelectorAll('.adm-panel[data-pane]').forEach(function (p) {
        p.hidden = p.getAttribute('data-pane') !== name;
      });
      // The page's own path: <base href="/"> would make a bare '#keys' the address of Merge, and F5 would open it.
      if (fromClick) history.replaceState(null, '', location.pathname + '#' + name);
      document.dispatchEvent(new CustomEvent('adm-pane', { detail: name }));
    }
    tabs.forEach(function (t) {
      t.addEventListener('click', function () { show(t.getAttribute('data-pane'), true); });
    });
    show(location.hash.slice(1));
  })();
</script>
</body>
</html>
