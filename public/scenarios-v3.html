<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Scenarios v3</title>
<!-- FIRST: hydrate localStorage from the server before page code runs, so UI
     state (selected scenario) survives a browser/device change. -->
<script src="/js/storage-sync.js"></script>
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/app-nav.css">
<link rel="stylesheet" href="css/gen-progress.css">
<link rel="stylesheet" href="css/scenarios-v3.css">
</head>
<body data-mode="library">

<!-- Which entry is lit is set from the address by js/app-nav.js, so this
     markup does not have to change when the page moves to /scenarios. -->
<nav class="sv3-nav">
  <a href="/character">Character</a>
  <a href="/scenarios">Scenarios</a>
  <a href="/merge">Merge</a>
  <a href="/birols">Birols</a>
  <span class="sp"></span>
  <a href="/library">Library</a>
  <span class="tag">talking head</span>
  <span class="sv3-bal" id="sv3-balance" title="API balance">…</span>
</nav>

<!-- Belongs to the Scenarios tab, not the global nav. Always present, even
     before any project exists. -->
<div class="sv3-bar" id="sv3-bar">
  <!-- Saves whatever is open and goes back to the library. It does NOT create anything:
       a project is created FROM a scenario, so this is the trip to pick one. -->
  <button class="sv3-btn sm" id="sv3-proj-new" type="button"
          title="Save what is open and go to the scenario library">New project</button>
  <label class="sv3-bar-fld">
    <span>Type</span>
    <select id="sv3-type">
      <!-- The value is the stored id. It was `ugc_ad` while the old page and its data
           still keyed off that; since Ph13.5 the id says what the label says. -->
      <option value="talking_head" selected>talking head</option>
      <option value="dialogues" disabled>dialogues — in development</option>
      <option value="voiceover" disabled>voiceover — in development</option>
    </select>
  </label>
  <label class="sv3-bar-fld" id="sv3-proj-fld">
    <span>Project</span>
    <select id="sv3-project"></select>
  </label>
  <button class="sv3-btn danger-solid sm" id="sv3-proj-del" disabled title="Delete this project">del</button>
  <span class="sp"></span>
  <span class="sv3-status" id="sv3-proj-status"></span>
</div>

<main id="sv3-cols">

  <!-- ── Scenario: the library. Full width on entry, collapses after a project
       is created. Three panes: list 1/4 | viewer 1/2 | metadata 1/4. ────── -->
  <section class="sv3-col" id="sv3-scenario">
    <div class="sv3-spine">Scenario</div>
    <div class="sv3-col-head">
      <span class="sv3-col-title">Scenario library</span>
      <span class="sp"></span>
      <span class="sv3-status" id="sv3-lib-status"></span>
    </div>
    <div class="sv3-col-body">
      <div id="sv3-lib">

        <div class="sv3-pane" id="sv3-pane-list">
          <div class="sv3-pane-head">
            <button class="sv3-btn sm" id="sv3-new" title="Add a scenario">+</button>
            <span>Scenarios</span>
            <span class="sp"></span>
            <!-- Which library this list is showing. Two, and they are one store read two ways:
                 library1 is what was written here by hand, library2 what was generated in
                 Library 2. The count moved into the options - a number that does not say what it
                 counts was the less useful half of this corner. -->
            <select id="sv3-lib-pick" title="Which scenario library to list">
              <option value="library1">library1</option>
              <option value="library2">library2</option>
            </select>
          </div>
          <div class="sv3-pane-body" id="sv3-list"></div>
        </div>

        <div class="sv3-pane" id="sv3-pane-view">
          <div class="sv3-pane-head">
            <input id="sv3-title" type="text" placeholder="untitled" disabled>
            <button class="sv3-btn sm" id="sv3-dup" disabled title="Duplicate this scenario">Duplicate</button>
            <button class="sv3-btn sm danger" id="sv3-del" disabled title="Delete this scenario">Delete</button>
          </div>
          <!-- saved scenario: one editable row per line -->
          <div class="sv3-pane-body" id="sv3-lines"></div>
          <!-- new scenario: the raw text box (one sentence per line) -->
          <div class="sv3-pane-body" id="sv3-create-body">
            <textarea id="sv3-draft-text" spellcheck="false"
              placeholder="Paste the scenario here — one sentence per line.&#10;&#10;Each line becomes one fragment.&#10;At least 5 lines are needed."></textarea>
          </div>
        </div>

        <div class="sv3-pane" id="sv3-pane-meta">
          <div class="sv3-pane-head"><span>Metadata</span></div>
          <!-- saved scenario: read-only rows -->
          <div class="sv3-pane-body" id="sv3-meta"></div>
          <!-- new scenario: the input fields (combos are built by JS) -->
          <div class="sv3-pane-body" id="sv3-create-meta">
            <label class="sv3-fld"><span>Vertical</span><span id="sv3-slot-vertical"></span></label>
            <label class="sv3-fld"><span>Product</span><span id="sv3-slot-product"></span></label>
            <label class="sv3-fld"><span>Role</span><span id="sv3-slot-role"></span></label>
            <label class="sv3-fld"><span>Gender</span>
              <select id="sv3-draft-gender">
                <option value="">—</option>
                <option value="male">male</option>
                <option value="female">female</option>
              </select>
            </label>
          </div>
        </div>

      </div>
      <div id="sv3-lib-foot">
        <span class="sv3-status" id="sv3-save-status"></span>
        <span class="sp"></span>
        <!-- view mode -->
        <button class="sv3-btn primary" id="sv3-create-project" disabled>Create project</button>
        <!-- create mode: Cancel needs two presses within 3s -->
        <button class="sv3-btn danger-solid" id="sv3-cancel">Cancel</button>
        <span id="sv3-save-wrap"><button class="sv3-btn primary" id="sv3-save" disabled>Save</button></span>
      </div>
    </div>
  </section>

  <!-- ── Casting / Montage / Fragments: shells only in this phase. ───────── -->
  <section class="sv3-col is-collapsed" id="sv3-casting">
    <div class="sv3-spine">Casting</div>
    <div class="sv3-col-head"><span class="sv3-col-title">Casting &amp; setting</span></div>
    <div class="sv3-col-body">
      <!-- Two slots, both inert in this phase: picking is wired up later. -->
      <div id="sv3-cast">
        <div class="sv3-slot" id="sv3-slot-character">
          <div class="sv3-slot-tag">character</div>
          <div class="sv3-slot-ph">+</div>
          <div class="sv3-slot-note" id="sv3-slot-character-note"></div>
        </div>
        <!-- no caption: the location image fills the whole card -->
        <div class="sv3-slot" id="sv3-slot-location">
          <div class="sv3-slot-tag">location</div>
          <div class="sv3-slot-ph">+</div>
        </div>
      </div>
      <!-- The mix is built from character x location, once per project, on demand. -->
      <div id="sv3-cast-actions">
        <span id="sv3-mix-wrap"><button class="sv3-btn primary" id="sv3-mix" title="Compose the first frame of each fragment">Build mix</button></span>
        <span class="sp"></span>
      </div>
    </div>
  </section>

  <!-- Montage: a gated stack. Voice comes first because the clip length IS the voice
       length and the lipsync takes the audio as an input, so video cannot start until
       the read exists. Video therefore stays shut and disabled until it can. -->
  <section class="sv3-col is-collapsed" id="sv3-montage">
    <div class="sv3-spine">Montage</div>
    <div class="sv3-col-head"><span class="sv3-col-title">Montage</span></div>
    <div class="sv3-col-body">
      <div class="sv3-mt" id="sv3-mt">

        <!-- The section header carries the provider picker. It is a ROW, not a button:
             a <select> inside a <button> is invalid, and a click on it would fold the
             section instead of opening the list. Only the caret and the title toggle. -->
        <section class="sv3-mt-sec" id="sv3-mt-voice">
          <div class="sv3-mt-head">
            <button class="sv3-mt-toggle" id="sv3-mt-voice-head" type="button">
              <span class="sv3-mt-caret">▸</span>
              <span class="sv3-mt-title">Voice-over</span>
            </button>
            <span class="sp"></span>
            <!-- no progress badge here: the Fragments header already counts the read,
                 and in a 200px column the two would not both fit anyway -->
            <select class="sv3-mt-prov" id="sv3-mt-provider"
                    title="Which service speaks the lines. Everything below belongs to it."></select>
          </div>
          <div class="sv3-mt-body" id="sv3-mt-voice-body">

            <label class="sv3-mt-fld">Voice
              <span class="sv3-mt-row">
                <select id="sv3-mt-voice-sel"></select>
                <button class="sv3-btn sm" id="sv3-mt-voice-gear" type="button"
                        title="Voice studio — find a voice for the cast character">&#9881;</button>
              </span>
            </label>

            <label class="sv3-mt-check">
              <input type="checkbox" id="sv3-mt-tags-on">
              <span>Add voice tags to the read</span>
            </label>
            <div class="sv3-mt-note" id="sv3-mt-model-note"></div>

            <span class="sv3-mt-fld" id="sv3-mt-mood-fld">Mood
              <span class="sv3-mt-row">
                <select id="sv3-mt-mood" disabled></select>
                <button class="sv3-btn sm" id="sv3-mt-mood-gear" type="button"
                        title="Mood briefs and tag sets — coming in a later phase" disabled>&#9881;</button>
                <span id="sv3-mt-tag-wrap">
                  <button class="sv3-btn" id="sv3-mt-tag" type="button" disabled>Insert</button>
                </span>
              </span>
            </span>
            <div class="sv3-mt-note" id="sv3-mt-mood-note"></div>

            <div class="sv3-mt-sep"></div>

            <div class="sv3-mt-row sv3-mt-allrow">
              <!-- which variant the batch targets; each line still carries its own -->
              <label class="sv3-pill" id="sv3-mt-batch-pill">
                <input type="checkbox" id="sv3-mt-batch">
                <span class="sv3-pill-track"><span class="sv3-pill-knob"></span></span>
                <span class="sv3-pill-cap" id="sv3-mt-batch-cap">plain</span>
              </label>
              <span id="sv3-mt-voiceall-wrap">
                <button class="sv3-btn primary" id="sv3-mt-voiceall" type="button">Voice all</button>
              </span>
            </div>
            <div class="sv3-status" id="sv3-mt-status"></div>
          </div>
        </section>

        <section class="sv3-mt-sec is-shut is-locked" id="sv3-mt-video">
          <div class="sv3-mt-head">
            <button class="sv3-mt-toggle" id="sv3-mt-video-head" type="button" disabled>
              <span class="sv3-mt-caret">▸</span>
              <span class="sv3-mt-title">Video</span>
            </button>
            <span class="sp"></span>
            <span class="sv3-mt-badge" id="sv3-mt-video-badge">voice first</span>
            <select class="sv3-mt-prov" id="sv3-mt-vmodel"
                    title="Which service lipsyncs the fragments. Everything below belongs to it."></select>
          </div>
          <div class="sv3-mt-body" id="sv3-mt-video-body">
            <span class="sv3-mt-fld">Motion
              <select id="sv3-mt-preset"></select>
            </span>
            <div class="sv3-mt-note" id="sv3-mt-preset-note"></div>
            <span class="sv3-mt-fld">Quality
              <select id="sv3-mt-quality"></select>
            </span>
            <div class="sv3-mt-note" id="sv3-mt-quality-note"></div>
            <div class="sv3-mt-row sv3-mt-allrow">
              <span id="sv3-mt-renderall-wrap">
                <button class="sv3-btn primary" id="sv3-mt-renderall" type="button">Render all</button>
              </span>
            </div>
            <div class="sv3-status" id="sv3-mt-video-status"></div>
          </div>
        </section>

      </div>
    </div>
  </section>

  <section class="sv3-col is-collapsed" id="sv3-fragments">
    <div class="sv3-spine">Fragments</div>
    <div class="sv3-col-head">
      <span class="sv3-col-title">Fragments</span>
      <span class="sp"></span>
      <!-- both counters read the variant each line is set to, so they never report
           progress for a take that is not the one in play -->
      <span class="sv3-frag-prog" id="sv3-frag-prog"></span>
      <!-- a toggle, not a dropdown: there is only one thing worth filtering to, and it
           is only clickable while such fragments exist. Repairing them is Voice all's
           job in the Montage column, which turns into Fix tags while any are broken. -->
      <button class="sv3-btn sm sv3-frag-filter" id="sv3-frag-filter" type="button" disabled></button>
      <span class="sv3-status" id="sv3-frag-status"></span>
    </div>
    <div class="sv3-col-body"><div id="sv3-frags"></div></div>
  </section>

</main>

<script type="module" src="js/scenarios-v3/main.js"></script>
</body>
</html>
