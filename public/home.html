<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Home</title>
<!-- FIRST: hydrate localStorage from the server before page code runs - where the blocks stand (`ugc_home_layout_v2`) and
     when this page was last visited are kept in the library like every page's own state. -->
<script src="/js/storage-sync.js"></script>
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/app-nav.css">
<link rel="stylesheet" href="css/home.css">
<!-- NEW CHARACTER right here - the Library's window (js/library/chmake.js): its buttons
     (css/lib-viewer.css .lib-btn), the wait over the portrait (css/gen-progress.css), the window (css/gen-window.css - linked
     so the first one opens dressed; data-gw tells the module) and the making itself (css/char-make.css). -->
<link rel="stylesheet" href="css/lib-viewer.css">
<link rel="stylesheet" href="css/gen-progress.css">
<link rel="stylesheet" href="css/gen-window.css" data-gw="1">
<link rel="stylesheet" href="css/char-make.css">
</head>
<body>

<!-- The app's side menu is built from these links by js/app-nav.js, which puts Home and the rest in; which entry is lit
     comes from the address. -->
<nav class="sv3-nav">
  <a href="/merge" data-tc="nav">Merge</a>
  <a href="/3d">3D Studio</a>
  <a href="/library">Library</a>
  <span class="sp"></span>
</nav>

<!-- Home has no sub-header; "Reset layout" is a quiet button in the corner under the blocks. -->
<main class="hm-body" id="hm-body">
  <div class="hm-pane" id="hm-overview">
    <div class="hm-cols" id="hm-cols">
      <div class="hm-col" data-col="0"></div>
      <div class="hm-col" data-col="1"></div>
    </div>
    <div class="hm-foot"><button class="u-btn is-s is-quiet" type="button" id="hm-reset" title="Put the blocks back where they were at first">Reset layout</button></div>
  </div>
</main>

<!-- New Character's content while its window is closed - built once, moved into the window and back
     (js/library/chmake.js). Hidden always. -->
<div class="lib-chmake" id="lib-chmake" hidden></div>

<script type="module" src="js/home/main.js"></script>
</body>
</html>
