name: Bug report
description: Something in UGC Studio does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for writing. **Never paste API keys** into an Issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Admin → This computer shows it.
      placeholder: "0.9.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: "Windows 11"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, step by step, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The lines of `logs/app.log` in your library folder around the moment it went wrong.
      render: text
  - type: textarea
    id: pictures
    attributes:
      label: Screenshots
      description: If they help. Make sure no key is in them.
